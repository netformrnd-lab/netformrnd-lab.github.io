<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미팅 히스토리 - 전략센터</title>
  <link rel="manifest" href="/admin/manifest.json">
  <meta name="theme-color" content="#3182f6">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    :root {
      --primary: #3182f6;
      --primary-light: #eef4ff;
      --primary-dark: #1b64da;
      --white: #ffffff;
      --gray-900: #191f28;
      --gray-800: #333d4b;
      --gray-700: #4e5968;
      --gray-600: #6b7684;
      --gray-500: #8b95a1;
      --gray-400: #b0b8c1;
      --gray-300: #d1d6db;
      --gray-200: #e5e8eb;
      --gray-100: #f2f4f6;
      --gray-50: #f9fafb;
      --success: #00c073;
      --success-light: #e8f7f0;
      --warning: #fc9600;
      --warning-light: #fff8f0;
      --danger: #f04452;
      --danger-light: #fff0f1;
      --info: #3182f6;
      --info-light: #eef4ff;
      --card-radius: 16px;
      --card-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: var(--gray-100);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: var(--gray-900);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    /* Header */
    .header {
      background: var(--white);
      border-bottom: 1px solid var(--gray-200);
      padding: 20px 0;
      margin-bottom: 24px;
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--gray-900);
    }

    .header-subtitle {
      font-size: 14px;
      color: var(--gray-600);
      margin-top: 2px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--primary);
      color: var(--white);
    }

    .btn-primary:hover { background: var(--primary-dark); }

    .btn-secondary {
      background: var(--gray-100);
      color: var(--gray-700);
    }

    .btn-secondary:hover { background: var(--gray-200); }

    .btn-danger {
      background: var(--danger);
      color: var(--white);
    }

    .btn-danger:hover { background: #d63240; }

    .btn-small {
      padding: 6px 12px;
      font-size: 13px;
    }

    /* View Toggle */
    .view-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .view-toggle .btn {
      flex: 1;
    }

    .view-toggle .btn.active {
      background: var(--primary);
      color: var(--white);
    }

    /* Meeting List View */
    .meeting-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .meeting-card {
      background: var(--white);
      border-radius: var(--card-radius);
      padding: 20px;
      box-shadow: var(--card-shadow);
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid var(--gray-200);
    }

    .meeting-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }

    .meeting-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .meeting-type {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }

    .meeting-type.report { background: var(--info-light); color: var(--info); }
    .meeting-type.proposal { background: var(--warning-light); color: var(--warning); }
    .meeting-type.review { background: var(--success-light); color: var(--success); }

    .meeting-date {
      font-size: 13px;
      color: var(--gray-500);
      font-weight: 500;
    }

    .meeting-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 8px;
    }

    .meeting-summary {
      font-size: 14px;
      color: var(--gray-600);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .meeting-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--gray-100);
    }

    .meeting-attendees {
      font-size: 13px;
      color: var(--gray-600);
    }

    .meeting-actions {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: background 0.15s ease;
    }

    .icon-btn:hover { background: var(--gray-100); }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
    }

    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 16px;
      opacity: 0.3;
    }

    .empty-state-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 8px;
    }

    .empty-state-desc {
      font-size: 14px;
      color: var(--gray-500);
      margin-bottom: 24px;
    }

    /* Report View */
    .report-view {
      display: none;
    }

    .report-view.active {
      display: block;
    }

    .report-container {
      background: var(--white);
      border-radius: var(--card-radius);
      padding: 40px;
      box-shadow: var(--card-shadow);
      max-width: 900px;
      margin: 0 auto;
    }

    .report-header {
      text-align: center;
      padding-bottom: 32px;
      border-bottom: 2px solid var(--gray-200);
      margin-bottom: 40px;
    }

    .report-type-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .report-title-input {
      width: 100%;
      font-size: 28px;
      font-weight: 800;
      text-align: center;
      border: none;
      padding: 8px;
      color: var(--gray-900);
      border-bottom: 2px solid transparent;
      transition: border-color 0.15s ease;
    }

    .report-title-input:focus {
      outline: none;
      border-bottom-color: var(--primary);
    }

    .report-meta {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .report-meta-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--gray-600);
    }

    .report-meta-item input {
      border: 1px solid var(--gray-300);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 14px;
      font-family: inherit;
      width: 140px;
    }

    .report-meta-item input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .report-section {
      margin-bottom: 40px;
    }

    .report-section-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .report-section-icon {
      font-size: 20px;
    }

    textarea, input[type="text"] {
      font-family: inherit;
    }

    .report-textarea {
      width: 100%;
      min-height: 120px;
      padding: 16px;
      border: 1px solid var(--gray-300);
      border-radius: 8px;
      font-size: 15px;
      line-height: 1.7;
      resize: vertical;
      transition: border-color 0.15s ease;
    }

    .report-textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .action-items {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .action-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .action-item input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--gray-300);
      border-radius: 8px;
      font-size: 14px;
    }

    .action-item input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .action-item-assignee {
      width: 120px;
    }

    .action-item-deadline {
      width: 140px;
    }

    .btn-add-item {
      align-self: flex-start;
      margin-top: 8px;
      background: var(--gray-100);
      color: var(--gray-700);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-add-item:hover {
      background: var(--gray-200);
    }

    .report-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      padding-top: 32px;
      border-top: 1px solid var(--gray-200);
      margin-top: 40px;
    }

    .tags-input {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--gray-300);
      border-radius: 8px;
      min-height: 48px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
    }

    .tag-remove {
      cursor: pointer;
      font-size: 16px;
      opacity: 0.7;
    }

    .tag-remove:hover {
      opacity: 1;
    }

    .tag-input {
      border: none;
      outline: none;
      flex: 1;
      min-width: 100px;
      font-size: 14px;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--white);
      border-radius: 16px;
      padding: 32px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .modal-desc {
      font-size: 14px;
      color: var(--gray-600);
      margin-bottom: 24px;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    /* Print Styles */
    @media print {
      body {
        background: white;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .header, .report-actions, .icon-btn, .list-view, .view-toggle {
        display: none !important;
      }
      .container {
        max-width: 100%;
        padding: 0;
      }
      .report-view {
        display: block !important;
      }
      .report-container {
        box-shadow: none;
        padding: 0;
        border: none;
      }
      .report-header {
        border-bottom: 2px solid #333;
        padding-bottom: 16px;
        margin-bottom: 20px;
      }
      .report-section {
        page-break-inside: avoid;
        margin-bottom: 20px;
      }
      .report-section-title {
        font-weight: 700;
        border-bottom: 1px solid #ddd;
        padding-bottom: 8px;
        margin-bottom: 12px;
      }
      .report-textarea, input {
        border: none !important;
        padding: 0 !important;
        background: transparent !important;
        resize: none;
        overflow: visible;
        min-height: auto !important;
        height: auto !important;
        white-space: pre-wrap;
        word-wrap: break-word;
        line-height: 1.8;
        font-size: 11pt;
      }
      .report-textarea {
        display: block;
        width: 100%;
      }
      .action-items-list {
        border: none;
      }
      .action-item {
        border-bottom: 1px dotted #ccc;
        padding: 8px 0;
      }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container {
        padding: 16px;
      }

      .header {
        padding: 16px 0;
      }

      .header-content {
        flex-direction: column;
        gap: 16px;
        align-items: flex-start;
      }

      .header-title {
        font-size: 18px;
      }

      .btn {
        width: 100%;
      }

      .meeting-list {
        grid-template-columns: 1fr;
      }

      .meeting-card {
        padding: 16px;
      }

      .report-container {
        padding: 20px;
      }

      .report-header {
        padding-bottom: 24px;
        margin-bottom: 32px;
      }

      .report-title-input {
        font-size: 22px;
      }

      .report-meta {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .report-meta-item {
        width: 100%;
      }

      .report-meta-item input,
      .report-meta-item select {
        width: 100%;
      }

      .action-item {
        flex-direction: column;
      }

      .action-item-assignee,
      .action-item-deadline {
        width: 100%;
      }

      .report-section {
        margin-bottom: 32px;
      }

      .report-section-title {
        font-size: 16px;
      }

      .report-textarea {
        min-height: 100px;
        font-size: 14px;
      }

      .report-actions {
        flex-direction: column;
        gap: 10px;
      }

      .report-actions .btn {
        width: 100%;
      }

      .view-toggle {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .tags-input {
        padding: 10px;
      }

      .tag {
        font-size: 12px;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 12px;
      }

      .report-container {
        padding: 16px;
      }

      .meeting-card {
        padding: 12px;
      }

      .meeting-title {
        font-size: 14px;
      }

      .meeting-summary {
        font-size: 13px;
      }

      .report-title-input {
        font-size: 20px;
      }

      .report-section-title {
        font-size: 15px;
      }

      .btn {
        padding: 10px 16px;
        font-size: 13px;
      }

      .btn-small {
        padding: 6px 10px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-content">
      <div>
        <div class="header-title">📋 미팅 히스토리</div>
        <div class="header-subtitle">전략센터 · 보고서 관리</div>
      </div>
      <button class="btn btn-primary" onclick="createNewReport()">
        ➕ 새 보고서
      </button>
    </div>
  </div>

  <div class="container">
    <!-- List View -->
    <div id="listView" class="list-view">
      <div class="view-toggle">
        <button class="btn btn-secondary active" onclick="filterReports('all')">전체</button>
        <button class="btn btn-secondary" onclick="filterReports('report')">보고</button>
        <button class="btn btn-secondary" onclick="filterReports('proposal')">제안</button>
        <button class="btn btn-secondary" onclick="filterReports('review')">검토</button>
      </div>

      <div id="meetingList" class="meeting-list">
        <!-- Meeting cards will be inserted here -->
      </div>

      <div id="emptyState" class="empty-state" style="display: none;">
        <div class="empty-state-icon">📝</div>
        <div class="empty-state-title">보고서가 없습니다</div>
        <div class="empty-state-desc">새 보고서를 작성하여 미팅 내용을 기록하세요</div>
        <button class="btn btn-primary" onclick="createNewReport()">첫 보고서 작성하기</button>
      </div>
    </div>

    <!-- Report View -->
    <div id="reportView" class="report-view">
      <div style="margin-bottom: 24px;">
        <button class="btn btn-secondary" onclick="showListView()">← 목록으로</button>
      </div>

      <div class="report-container">
        <div class="report-header">
          <span class="report-type-badge" id="reportTypeBadge" style="background: var(--info-light); color: var(--info);">보고</span>
          <input type="text" class="report-title-input" id="reportTitle" placeholder="보고서 제목을 입력하세요">

          <div class="report-meta">
            <div class="report-meta-item">
              <span>📅 날짜:</span>
              <input type="date" id="reportDate">
            </div>
            <div class="report-meta-item">
              <span>👤 작성자:</span>
              <input type="text" id="reportAuthor" placeholder="이름">
            </div>
            <div class="report-meta-item">
              <span>📂 유형:</span>
              <select id="reportType" style="border: 1px solid var(--gray-300); border-radius: 6px; padding: 6px 10px; font-size: 14px; font-family: inherit;">
                <option value="report">보고</option>
                <option value="proposal">제안</option>
                <option value="review">검토</option>
              </select>
            </div>
          </div>
        </div>

        <div class="report-section">
          <div class="report-section-title">
            <span class="report-section-icon">👥</span>
            참석자
          </div>
          <div class="tags-input" id="attendeesContainer">
            <input type="text" class="tag-input" id="attendeeInput" placeholder="이름 입력 후 Enter">
          </div>
        </div>

        <div class="report-section">
          <div class="report-section-title">
            <span class="report-section-icon">📌</span>
            안건 / 목적
          </div>
          <textarea class="report-textarea" id="reportAgenda" placeholder="미팅의 안건과 목적을 작성하세요"></textarea>
        </div>

        <div class="report-section">
          <div class="report-section-title">
            <span class="report-section-icon">💬</span>
            논의 내용
          </div>
          <textarea class="report-textarea" id="reportDiscussion" style="min-height: 200px;" placeholder="논의된 내용을 상세히 작성하세요"></textarea>
        </div>

        <div class="report-section">
          <div class="report-section-title">
            <span class="report-section-icon">✅</span>
            결정 사항
          </div>
          <textarea class="report-textarea" id="reportDecisions" placeholder="미팅에서 결정된 사항을 작성하세요"></textarea>
        </div>

        <div class="report-section">
          <div class="report-section-title">
            <span class="report-section-icon">📊</span>
            연관 KPI
          </div>
          <div id="relatedKpisContainer">
            <select id="kpiSelector" style="width: 100%; padding: 12px; border: 1px solid var(--gray-300); border-radius: 8px; font-size: 14px; font-family: inherit;">
              <option value="">관련 KPI 선택...</option>
            </select>
            <div id="selectedKpisList" style="margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px;">
              <!-- Selected KPIs will appear here as tags -->
            </div>
          </div>
        </div>

        <div class="report-section">
          <div class="report-section-title">
            <span class="report-section-icon">🎯</span>
            액션 아이템
          </div>
          <div class="action-items" id="actionItemsContainer">
            <!-- Action items will be inserted here -->
          </div>
          <button class="btn btn-small btn-add-item" onclick="addActionItem()">
            <span>+</span> 액션 아이템 추가
          </button>
        </div>

        <div class="report-section">
          <div class="report-section-title">
            <span class="report-section-icon">📝</span>
            비고 / 특이사항
          </div>
          <textarea class="report-textarea" id="reportNotes" placeholder="추가로 기록할 내용이 있다면 작성하세요"></textarea>
        </div>

        <div class="report-actions">
          <button class="btn btn-secondary" onclick="showListView()">취소</button>
          <button class="btn btn-secondary" onclick="printReport()">🖨️ 인쇄</button>
          <button class="btn btn-primary" onclick="saveReport()">💾 저장</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="deleteModal" class="modal">
    <div class="modal-content">
      <div class="modal-title">보고서 삭제</div>
      <div class="modal-desc">이 보고서를 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.</div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeDeleteModal()">취소</button>
        <button class="btn btn-danger" onclick="confirmDelete()">삭제</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <script>
    // Firebase initialization
    const firebaseConfig = {
      apiKey: "AIzaSyAQf_Cu9wMji5QsMBQns5eg6nOD_vmrZMs",
      authDomain: "moyeora-deal-manager.firebaseapp.com",
      projectId: "moyeora-deal-manager",
      storageBucket: "moyeora-deal-manager.firebasestorage.app",
      messagingSenderId: "527148187832",
      appId: "1:527148187832:web:dc35b0413a7157db34744d"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const db = firebase.firestore();
    const auth = firebase.auth();

    let reports = [];
    let currentReportId = null;
    let deleteTargetId = null;
    let currentFilter = 'all';
    let unsubscribeMeetings = null;

    // Initialize
    function init() {
      // Check authentication
      auth.onAuthStateChanged(user => {
        if (!user) {
          window.location.href = '/admin/';
          return;
        }

        // Load meetings from Firestore
        loadMeetings();
        setupEventListeners();

        // URL parameter check
        const urlParams = new URLSearchParams(window.location.search);
        const reportId = urlParams.get('id');
        if (reportId) {
          setTimeout(() => viewReport(reportId), 500);
        }
      });
    }

    // Load meetings from Firestore with real-time sync
    function loadMeetings() {
      if (unsubscribeMeetings) {
        unsubscribeMeetings();
      }

      unsubscribeMeetings = db.collection('okr_meetings')
        .orderBy('createdAt', 'desc')
        .onSnapshot(snapshot => {
          reports = snapshot.docs.map(doc => ({
            id: doc.id,
            ...doc.data()
          }));
          renderReports();
        }, error => {
          console.error('Meeting load error:', error);
          alert('미팅 데이터 로드 실패: ' + error.message);
        });
    }

    let availableKpis = [];
    let selectedKpiIds = [];

    function setupEventListeners() {
      // Attendee input
      document.getElementById('attendeeInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.target.value.trim()) {
          e.preventDefault();
          addAttendee(e.target.value.trim());
          e.target.value = '';
        }
      });

      // Report type change
      document.getElementById('reportType').addEventListener('change', (e) => {
        updateReportTypeBadge(e.target.value);
      });

      // KPI selector
      document.getElementById('kpiSelector').addEventListener('change', (e) => {
        if (e.target.value) {
          addRelatedKpi(e.target.value);
          e.target.value = '';
        }
      });

      // Date default
      document.getElementById('reportDate').valueAsDate = new Date();

      // Load KPIs for selector
      loadKpisForSelector();
    }

    // Load all KPIs for the selector
    async function loadKpisForSelector() {
      try {
        const [krsSnapshot, kpisSnapshot] = await Promise.all([
          db.collection('okr_keyResults').get(),
          db.collection('okr_kpis').get()
        ]);

        availableKpis = [
          ...krsSnapshot.docs.map(doc => ({
            id: doc.id,
            name: doc.data().name,
            type: 'Main KPI',
            ...doc.data()
          })),
          ...kpisSnapshot.docs.map(doc => ({
            id: doc.id,
            name: doc.data().name,
            type: 'Sub KPI',
            ...doc.data()
          }))
        ];

        updateKpiSelector();
      } catch (error) {
        console.error('KPI load error:', error);
      }
    }

    function updateKpiSelector() {
      const selector = document.getElementById('kpiSelector');
      const options = availableKpis
        .filter(kpi => !selectedKpiIds.includes(kpi.id))
        .map(kpi => `<option value="${kpi.id}">[${kpi.type}] ${kpi.name}</option>`)
        .join('');
      selector.innerHTML = '<option value="">관련 KPI 선택...</option>' + options;
    }

    function addRelatedKpi(kpiId) {
      if (selectedKpiIds.includes(kpiId)) return;

      selectedKpiIds.push(kpiId);
      renderSelectedKpis();
      updateKpiSelector();
    }

    function removeRelatedKpi(kpiId) {
      selectedKpiIds = selectedKpiIds.filter(id => id !== kpiId);
      renderSelectedKpis();
      updateKpiSelector();
    }

    function renderSelectedKpis() {
      const container = document.getElementById('selectedKpisList');
      const selectedKpis = availableKpis.filter(kpi => selectedKpiIds.includes(kpi.id));

      container.innerHTML = selectedKpis.map(kpi => `
        <div class="tag">
          <a href="/admin/strategy/?kpi=${kpi.id}" target="_blank" style="color: inherit; text-decoration: none;">
            [${kpi.type}] ${kpi.name}
          </a>
          <span class="tag-remove" onclick="removeRelatedKpi('${kpi.id}')">×</span>
        </div>
      `).join('');
    }

    function updateReportTypeBadge(type) {
      const badge = document.getElementById('reportTypeBadge');
      const styles = {
        report: { bg: 'var(--info-light)', color: 'var(--info)', text: '보고' },
        proposal: { bg: 'var(--warning-light)', color: 'var(--warning)', text: '제안' },
        review: { bg: 'var(--success-light)', color: 'var(--success)', text: '검토' }
      };
      const style = styles[type];
      badge.style.background = style.bg;
      badge.style.color = style.color;
      badge.textContent = style.text;
    }

    function addAttendee(name) {
      const container = document.getElementById('attendeesContainer');
      const input = document.getElementById('attendeeInput');

      const tag = document.createElement('div');
      tag.className = 'tag';
      tag.innerHTML = `
        ${name}
        <span class="tag-remove" onclick="this.parentElement.remove()">×</span>
      `;

      container.insertBefore(tag, input);
    }

    function addActionItem() {
      const container = document.getElementById('actionItemsContainer');
      const item = document.createElement('div');
      item.className = 'action-item';
      item.innerHTML = `
        <input type="text" placeholder="해야 할 일" class="action-task">
        <input type="text" placeholder="담당자" class="action-item-assignee action-assignee">
        <input type="date" class="action-item-deadline action-deadline">
        <button class="icon-btn" onclick="this.parentElement.remove()">🗑️</button>
      `;
      container.appendChild(item);
    }

    function createNewReport() {
      currentReportId = null;
      clearReportForm();
      showReportView();
    }

    function clearReportForm() {
      document.getElementById('reportTitle').value = '';
      document.getElementById('reportDate').valueAsDate = new Date();
      document.getElementById('reportAuthor').value = '';
      document.getElementById('reportType').value = 'report';
      updateReportTypeBadge('report');
      document.getElementById('reportAgenda').value = '';
      document.getElementById('reportDiscussion').value = '';
      document.getElementById('reportDecisions').value = '';
      document.getElementById('reportNotes').value = '';

      // Clear attendees
      const attendeesContainer = document.getElementById('attendeesContainer');
      const tags = attendeesContainer.querySelectorAll('.tag');
      tags.forEach(tag => tag.remove());

      // Clear action items
      document.getElementById('actionItemsContainer').innerHTML = '';

      // Clear selected KPIs
      selectedKpiIds = [];
      renderSelectedKpis();
      updateKpiSelector();
    }

    async function saveReport() {
      const title = document.getElementById('reportTitle').value.trim();
      if (!title) {
        alert('보고서 제목을 입력해주세요.');
        return;
      }

      const attendees = Array.from(document.querySelectorAll('#attendeesContainer .tag'))
        .map(tag => tag.textContent.replace('×', '').trim());

      const actionItems = Array.from(document.querySelectorAll('.action-item'))
        .map(item => ({
          task: item.querySelector('.action-task').value,
          assignee: item.querySelector('.action-assignee').value,
          deadline: item.querySelector('.action-deadline').value,
          completed: false,
          worklogId: null // Link to worklog when completed
        }))
        .filter(item => item.task);

      const currentUser = auth.currentUser;
      const report = {
        title,
        date: document.getElementById('reportDate').value,
        author: document.getElementById('reportAuthor').value || currentUser?.displayName || currentUser?.email || '미상',
        authorId: currentUser?.uid || null,
        type: document.getElementById('reportType').value,
        attendees,
        agenda: document.getElementById('reportAgenda').value,
        discussion: document.getElementById('reportDiscussion').value,
        decisions: document.getElementById('reportDecisions').value,
        notes: document.getElementById('reportNotes').value,
        actionItems,
        relatedKpiIds: selectedKpiIds, // Linked KPIs
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        if (currentReportId) {
          // Update existing meeting
          await db.collection('okr_meetings').doc(currentReportId).update(report);
          alert('미팅 보고서가 수정되었습니다.');
        } else {
          // Create new meeting
          report.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          const docRef = await db.collection('okr_meetings').add(report);
          console.log('Meeting created:', docRef.id);
          alert('미팅 보고서가 저장되었습니다.');
        }
        showListView();
      } catch (error) {
        console.error('Save error:', error);
        alert('저장 실패: ' + error.message);
      }
    }

    function viewReport(id) {
      const report = reports.find(r => r.id === id);
      if (!report) return;

      currentReportId = id;

      document.getElementById('reportTitle').value = report.title || '';
      document.getElementById('reportDate').value = report.date || '';
      document.getElementById('reportAuthor').value = report.author || '';
      document.getElementById('reportType').value = report.type || 'report';
      updateReportTypeBadge(report.type || 'report');
      document.getElementById('reportAgenda').value = report.agenda || '';
      document.getElementById('reportDiscussion').value = report.discussion || '';
      document.getElementById('reportDecisions').value = report.decisions || '';
      document.getElementById('reportNotes').value = report.notes || '';

      // Load attendees
      const attendeesContainer = document.getElementById('attendeesContainer');
      const existingTags = attendeesContainer.querySelectorAll('.tag');
      existingTags.forEach(tag => tag.remove());
      if (report.attendees) {
        report.attendees.forEach(name => addAttendee(name));
      }

      // Load action items
      const actionItemsContainer = document.getElementById('actionItemsContainer');
      actionItemsContainer.innerHTML = '';
      if (report.actionItems) {
        report.actionItems.forEach(item => {
          addActionItem();
          const lastItem = actionItemsContainer.lastElementChild;
          lastItem.querySelector('.action-task').value = item.task || '';
          lastItem.querySelector('.action-assignee').value = item.assignee || '';
          lastItem.querySelector('.action-deadline').value = item.deadline || '';
        });
      }

      // Load related KPIs
      selectedKpiIds = report.relatedKpiIds || [];
      renderSelectedKpis();
      updateKpiSelector();

      showReportView();

      // Update URL
      history.pushState(null, '', `?id=${id}`);
    }

    function deleteReport(id, event) {
      event.stopPropagation();
      deleteTargetId = id;
      document.getElementById('deleteModal').classList.add('active');
    }

    async function confirmDelete() {
      try {
        await db.collection('okr_meetings').doc(deleteTargetId).delete();
        closeDeleteModal();
        alert('보고서가 삭제되었습니다.');
      } catch (error) {
        console.error('Delete error:', error);
        alert('삭제 실패: ' + error.message);
      }
    }

    function closeDeleteModal() {
      document.getElementById('deleteModal').classList.remove('active');
      deleteTargetId = null;
    }

    function shareReport(id, event) {
      event.stopPropagation();
      const url = `${window.location.origin}${window.location.pathname}?id=${id}`;
      navigator.clipboard.writeText(url).then(() => {
        alert('보고서 링크가 복사되었습니다!');
      });
    }

    function filterReports(type) {
      currentFilter = type;

      // Update button states
      const buttons = document.querySelectorAll('.view-toggle .btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      renderReports();
    }

    function renderReports() {
      const container = document.getElementById('meetingList');
      const emptyState = document.getElementById('emptyState');

      let filteredReports = reports;
      if (currentFilter !== 'all') {
        filteredReports = reports.filter(r => r.type === currentFilter);
      }

      if (filteredReports.length === 0) {
        container.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';

      container.innerHTML = filteredReports.map(report => {
        const typeStyles = {
          report: { class: 'report', text: '보고' },
          proposal: { class: 'proposal', text: '제안' },
          review: { class: 'review', text: '검토' }
        };
        const typeStyle = typeStyles[report.type] || typeStyles.report;

        const attendeeCount = (report.attendees && report.attendees.length) || 0;
        const actionItemCount = (report.actionItems && report.actionItems.length) || 0;
        const kpiCount = (report.relatedKpiIds && report.relatedKpiIds.length) || 0;

        return `
          <div class="meeting-card" onclick="viewReport('${report.id}')">
            <div class="meeting-card-header">
              <span class="meeting-type ${typeStyle.class}">${typeStyle.text}</span>
              <span class="meeting-date">${report.date || ''}</span>
            </div>
            <div class="meeting-title">${report.title || '제목 없음'}</div>
            <div class="meeting-summary">${report.agenda || report.discussion || '내용 없음'}</div>
            <div class="meeting-footer">
              <div class="meeting-attendees">
                👥 ${attendeeCount}명
                ${actionItemCount > 0 ? `· 🎯 ${actionItemCount}개 액션` : ''}
                ${kpiCount > 0 ? `· 📊 ${kpiCount}개 KPI` : ''}
              </div>
              <div class="meeting-actions">
                <button class="icon-btn" onclick="shareReport('${report.id}', event)" title="공유">🔗</button>
                <button class="icon-btn" onclick="deleteReport('${report.id}', event)" title="삭제">🗑️</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function showListView() {
      document.getElementById('listView').style.display = 'block';
      document.getElementById('reportView').classList.remove('active');
      history.pushState(null, '', window.location.pathname);
      renderReports();
    }

    function showReportView() {
      document.getElementById('listView').style.display = 'none';
      document.getElementById('reportView').classList.add('active');
    }

    function printReport() {
      window.print();
    }

    // Initialize on load
    init();
  </script>
</body>
</html>
