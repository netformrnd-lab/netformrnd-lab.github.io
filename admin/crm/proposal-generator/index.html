<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>AI 제안서 생성기 - 모여라딜 CRM</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <style>
    :root {
      --primary: #7c3aed;
      --primary-light: #ede9fe;
      --primary-dark: #6d28d9;
      --gold: #F5A623;
      --gold-light: #FFBE45;
      --gold-dark: #E08A00;
      --bg-dark: #0A0806;
      --white: #ffffff;
      --gray-900: #191f28;
      --gray-800: #333d4b;
      --gray-700: #4e5968;
      --gray-600: #6b7684;
      --gray-500: #8b95a1;
      --gray-400: #b0b8c1;
      --gray-300: #d1d6db;
      --gray-200: #e5e8eb;
      --gray-100: #f2f4f6;
      --success: #10B981;
      --warning: #fc9600;
      --danger: #EF4444;
      --info: #3B82F6;
      --pink: #EC4899;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: var(--gray-900);
      line-height: 1.5;
    }

    /* 로그인 화면 */
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container { width: 100%; max-width: 400px; }

    .login-logo { text-align: center; margin-bottom: 32px; }

    .login-logo-text {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #a78bfa, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-logo-desc { font-size: 14px; color: var(--gray-400); margin-top: 8px; }

    .login-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 32px;
    }

    .login-title { font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 24px; color: white; }

    .login-error {
      background: rgba(240, 68, 82, 0.2);
      border: 1px solid rgba(240, 68, 82, 0.3);
      color: #ff6b81;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }

    .login-error.show { display: block; }

    .login-input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      color: white;
      margin-bottom: 12px;
    }

    .login-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.3);
    }

    .login-input::placeholder { color: var(--gray-500); }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #a78bfa, #7c3aed);
      color: white;
      font-family: inherit;
      transition: all 0.2s;
    }

    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* 메인 앱 */
    .main-app { display: none; min-height: 100vh; flex-direction: column; }
    .main-app.visible { display: flex; }

    /* 헤더 */
    .app-header {
      height: 60px;
      background: rgba(26, 26, 46, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
    }

    .header-left { display: flex; align-items: center; gap: 16px; }

    .header-logo {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-badge {
      padding: 4px 10px;
      background: rgba(124, 58, 237, 0.2);
      border: 1px solid rgba(124, 58, 237, 0.3);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      color: #a78bfa;
    }

    .header-right { display: flex; align-items: center; gap: 12px; }

    .header-btn {
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: var(--gray-300);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .header-btn:hover { background: rgba(255, 255, 255, 0.12); color: white; }

    /* 메인 컨테이너 */
    .app-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
      overflow: hidden;
    }

    /* 왼쪽 패널 - 입력 */
    .input-panel {
      width: 480px;
      background: rgba(255, 255, 255, 0.02);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .panel-header h2 { font-size: 16px; font-weight: 700; color: white; margin-bottom: 8px; }
    .panel-header p { font-size: 13px; color: var(--gray-400); }

    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    /* 입력 섹션 */
    .input-section {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: white;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title .icon { font-size: 18px; }

    /* 파일 업로드 */
    .file-upload-area {
      border: 2px dashed rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .file-upload-area:hover {
      border-color: var(--primary);
      background: rgba(124, 58, 237, 0.1);
    }

    .file-upload-area .icon { font-size: 40px; margin-bottom: 12px; }
    .file-upload-area .title { font-size: 14px; font-weight: 600; color: white; margin-bottom: 6px; }
    .file-upload-area .desc { font-size: 12px; color: var(--gray-400); }

    .uploaded-files {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .uploaded-file {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 8px;
      font-size: 13px;
      color: var(--success);
    }

    .uploaded-file .remove {
      margin-left: auto;
      cursor: pointer;
      opacity: 0.7;
    }

    .uploaded-file .remove:hover { opacity: 1; }

    /* URL 입력 */
    .url-input-group {
      display: flex;
      gap: 8px;
    }

    .url-input {
      flex: 1;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: white;
      font-size: 13px;
      font-family: inherit;
    }

    .url-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .url-btn {
      padding: 12px 20px;
      background: var(--primary);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }

    /* 폼 입력 */
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--gray-300); margin-bottom: 8px; }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: white;
      font-size: 14px;
      font-family: inherit;
    }

    .form-input:focus { outline: none; border-color: var(--primary); }
    .form-input::placeholder { color: var(--gray-500); }

    .form-textarea { min-height: 100px; resize: vertical; }

    /* 생성 버튼 */
    .generate-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
      border: none;
      border-radius: 12px;
      color: var(--bg-dark);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .generate-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(245, 166, 35, 0.4); }
    .generate-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* 오른쪽 패널 - 미리보기 */
    .preview-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #1a1a2e;
      overflow: hidden;
    }

    .preview-header {
      padding: 16px 24px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .preview-tabs { display: flex; gap: 8px; }

    .preview-tab {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: var(--gray-400);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .preview-tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .preview-actions { display: flex; gap: 8px; }

    .action-btn {
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: var(--gray-300);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .action-btn:hover { background: rgba(255, 255, 255, 0.12); color: white; }

    .action-btn.primary {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--bg-dark);
    }

    /* 미리보기 컨텐츠 */
    .preview-content {
      flex: 1;
      overflow: auto;
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .preview-scroll {
      max-height: 100%;
      overflow-y: auto;
    }

    /* 제안서 페이지 스타일 */
    .proposal-page {
      width: 960px;
      min-height: 540px;
      background: linear-gradient(180deg, #0A0806 0%, #141210 100%);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      margin-bottom: 20px;
      color: white;
    }

    .proposal-page::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(245,166,35,0.1) 0%, transparent 50%);
      pointer-events: none;
    }

    .proposal-header {
      position: absolute;
      top: 30px;
      left: 40px;
      right: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .proposal-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 800;
      color: var(--gold);
    }

    .page-num { font-size: 12px; color: var(--gray-500); }

    .proposal-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 85%;
    }

    .proposal-title {
      font-family: 'Outfit', sans-serif;
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .gradient-text {
      background: linear-gradient(135deg, #FFBE45 0%, #F5A623 50%, #E08A00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .proposal-subtitle {
      font-size: 16px;
      color: var(--gray-400);
      margin-bottom: 40px;
    }

    .stats-row {
      display: flex;
      justify-content: center;
      gap: 60px;
    }

    .stat-item { text-align: center; }

    .stat-value {
      font-family: 'Outfit', sans-serif;
      font-size: 48px;
      font-weight: 800;
      color: var(--gold);
    }

    .stat-unit {
      font-size: 18px;
      color: var(--gold);
      margin-left: 4px;
    }

    .stat-label {
      font-size: 13px;
      color: var(--gray-500);
      margin-top: 6px;
    }

    /* 카테고리 카드 */
    .category-grid {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 30px;
    }

    .category-card {
      width: 220px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      position: relative;
    }

    .category-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      border-radius: 16px 16px 0 0;
    }

    .category-card.green::before { background: var(--success); }
    .category-card.pink::before { background: var(--pink); }
    .category-card.blue::before { background: var(--info); }

    .category-name { font-size: 14px; font-weight: 700; margin-bottom: 12px; }

    .category-count {
      font-family: 'Outfit', sans-serif;
      font-size: 48px;
      font-weight: 800;
    }

    .category-card.green .category-count { color: var(--success); }
    .category-card.pink .category-count { color: var(--pink); }
    .category-card.blue .category-count { color: var(--info); }

    .category-unit { font-size: 12px; color: var(--gray-500); margin-top: 4px; }

    .category-discount {
      margin-top: 16px;
      padding: 10px;
      background: rgba(239, 68, 68, 0.15);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--danger);
    }

    /* 편집 도구 */
    .editor-toolbar {
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tool-btn {
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: var(--gray-300);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .tool-btn:hover {
      background: rgba(124, 58, 237, 0.2);
      border-color: var(--primary);
      color: white;
    }

    /* 로딩 */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }

    .loading-overlay.visible { opacity: 1; visibility: visible; }

    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      margin-top: 20px;
      font-size: 16px;
      color: white;
      font-weight: 500;
    }

    /* 모달 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }

    .modal-overlay.visible { opacity: 1; visibility: visible; }

    .modal-box {
      background: white;
      border-radius: 16px;
      padding: 32px;
      width: 90%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-title { font-size: 18px; font-weight: 700; color: var(--gray-900); margin-bottom: 24px; }

    .modal-actions { display: flex; gap: 12px; margin-top: 24px; }

    .modal-btn {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      border: none;
    }

    .modal-btn.cancel { background: var(--gray-100); color: var(--gray-600); }
    .modal-btn.confirm { background: var(--primary); color: white; }

    /* 빈 상태 */
    .empty-state {
      text-align: center;
      padding: 80px 40px;
      color: var(--gray-500);
    }

    .empty-state .icon { font-size: 64px; margin-bottom: 20px; opacity: 0.5; }
    .empty-state .title { font-size: 18px; font-weight: 600; color: var(--gray-300); margin-bottom: 8px; }
    .empty-state .desc { font-size: 14px; }
  </style>
</head>
<body>
  <!-- 로그인 화면 -->
  <div class="login-screen" id="loginScreen">
    <div class="login-container">
      <div class="login-logo">
        <div class="login-logo-text">AI 제안서 생성기</div>
        <p class="login-logo-desc">모여라딜 CRM 전용</p>
      </div>
      <div class="login-card">
        <h2 class="login-title">🔐 관리자 로그인</h2>
        <div class="login-error" id="loginError"></div>
        <input type="text" class="login-input" id="loginId" placeholder="아이디">
        <input type="password" class="login-input" id="loginPassword" placeholder="비밀번호" onkeypress="if(event.key==='Enter')handleLogin()">
        <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--gray-400); margin: 12px 0; cursor: pointer;">
          <input type="checkbox" id="saveCredentials" style="width: 16px; height: 16px;">
          아이디/비밀번호 저장
        </label>
        <button class="login-btn" id="loginBtn" onclick="handleLogin()">로그인</button>
      </div>
    </div>
  </div>

  <!-- 메인 앱 -->
  <div class="main-app" id="mainApp">
    <header class="app-header">
      <div class="header-left">
        <span class="header-logo">AI 제안서 생성기</span>
        <span class="header-badge">Claude Sonnet 4</span>
      </div>
      <div class="header-right">
        <button class="header-btn" onclick="showApiKeyModal()">⚙️ API 키</button>
        <button class="header-btn" onclick="resetAll()">🔄 새로 만들기</button>
        <button class="header-btn" onclick="window.location.href='/admin/crm/'">← CRM센터</button>
      </div>
    </header>

    <div class="app-container">
      <!-- 입력 패널 -->
      <div class="input-panel">
        <div class="panel-header">
          <h2>📋 제안서 정보 입력</h2>
          <p>상품 정보를 입력하면 맞춤 제안서를 생성합니다</p>
        </div>

        <div class="panel-content">
          <!-- 기본 정보 -->
          <div class="input-section">
            <div class="section-title"><span class="icon">🏢</span> 기본 정보</div>
            <div class="form-group">
              <label class="form-label">공급사명 *</label>
              <input type="text" class="form-input" id="companyName" placeholder="예: 지비컴퍼니">
            </div>
            <div class="form-group">
              <label class="form-label">담당자명</label>
              <input type="text" class="form-input" id="contactName" placeholder="예: 김대표">
            </div>
          </div>

      const member = teamMembers.find(m => m.loginId === loginId && m.loginPw === loginPw);

        localStorage.removeItem('moyeora_proposal_saved_id');
        localStorage.removeItem('moyeora_proposal_saved_pw');
      }

      currentUser = user;
      sessionStorage.setItem('moyeora_proposal_user', JSON.stringify(currentUser));

      document.getElementById('mainApp').classList.add('visible');

      if (!apiKey) setTimeout(() => showApiKeyModal(), 500);
    }

    function checkLoginStatus() {
      const savedUser = sessionStorage.getItem('moyeora_proposal_user');

        currentUser = JSON.parse(savedUser);

    // ===== 파일 업로드 =====
    function handleFileUpload(event) {
      const files = event.target.files;
      for (const file of files) {
        uploadedFiles.push(file);
        renderUploadedFiles();

        // 엑셀 파일 파싱
        if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
          parseExcelFile(file);
        }
      }
    }

    async function parseExcelFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const jsonData = XLSX.utils.sheet_to_json(firstSheet);
        console.log('엑셀 데이터:', jsonData);
        // 파싱된 데이터 저장
        file.parsedData = jsonData;
      };
      reader.readAsArrayBuffer(file);
    }

    function renderUploadedFiles() {
      const container = document.getElementById('uploadedFiles');
      container.innerHTML = uploadedFiles.map((file, i) => `
        <div class="uploaded-file">

          <span class="remove" onclick="removeFile(${i})">✕</span>
        </div>

    }

      uploadedFiles.splice(index, 1);
      renderUploadedFiles();
    }

      const input = document.getElementById('urlInput');

        addedUrls.push(url);
        renderAddedUrls();
        input.value = '';

    }

첨부 파일: ${inputData.files.map(f => f.name).join(', ') || '없음'}

            <h2 style="font-size: 26px; font-weight: 600; margin-bottom: 10px;">${proposal.companyName} × 모여라딜</h2>
            <h3 style="font-family: 'Outfit', sans-serif; font-size: 38px; font-weight: 800; color: var(--gold); margin-bottom: 40px;">기대 효과</h3>
            <div style="display: flex; justify-content: center; gap: 30px;">
              <div style="width: 200px; padding: 30px 20px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 18px; text-align: center;">
                <div style="font-size: 36px; margin-bottom: 12px;">📈</div>
                <div style="font-size: 13px; color: var(--gray-500); margin-bottom: 8px;">전환율</div>
                <div style="font-family: 'Outfit', sans-serif; font-size: 32px; font-weight: 800; color: var(--gold);">${proposal.expectedResults.conversionRate}</div>
              </div>
              <div style="width: 200px; padding: 30px 20px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 18px; text-align: center;">
                <div style="font-size: 36px; margin-bottom: 12px;">📸</div>
                <div style="font-size: 13px; color: var(--gray-500); margin-bottom: 8px;">콘텐츠</div>
                <div style="font-family: 'Outfit', sans-serif; font-size: 32px; font-weight: 800; color: var(--gold);">${proposal.expectedResults.contentCount}</div>
              </div>
              <div style="width: 200px; padding: 30px 20px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 18px; text-align: center;">
                <div style="font-size: 36px; margin-bottom: 12px;">💰</div>
                <div style="font-size: 13px; color: var(--gray-500); margin-bottom: 8px;">정산</div>
                <div style="font-family: 'Outfit', sans-serif; font-size: 32px; font-weight: 800; color: var(--gold);">${proposal.expectedResults.settlementDays}</div>
              </div>
            </div>
            <p style="margin-top: 40px; font-size: 18px; font-weight: 600;">지금 바로 ${proposal.companyName}의 성공적인 판매를 시작하세요</p>
          </div>
        </div>
      `;
    }

    // ===== 로딩 =====
    function showLoading(text) {
      document.getElementById('loadingText').textContent = text;
      document.getElementById('loadingOverlay').classList.add('visible');
    }

    function updateLoading(text) {
      document.getElementById('loadingText').textContent = text;
    }

    function hideLoading() {
      document.getElementById('loadingOverlay').classList.remove('visible');
    }

    // ===== 탭 전환 =====
    function switchTab(tab) {
      document.querySelectorAll('.preview-tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');

      if (tab === 'edit') {
        document.getElementById('editorToolbar').style.display = 'flex';
      } else {
        document.getElementById('editorToolbar').style.display = 'none';
      }
    }

    // ===== 미디어 삽입 =====
    function insertMedia(type) {
      currentMediaType = type;
      const modal = document.getElementById('mediaModal');
      const title = document.getElementById('mediaModalTitle');
      const content = document.getElementById('mediaModalContent');

      const forms = {
        video: `
          <div class="form-group">
            <label class="form-label" style="color: var(--gray-700);">YouTube URL</label>
            <input type="text" class="form-input" id="mediaUrl" placeholder="https://youtube.com/watch?v=..." style="background: var(--gray-50); color: var(--gray-900); border-color: var(--gray-300);">
          </div>
        `,
        image: `
          <div class="form-group">
            <label class="form-label" style="color: var(--gray-700);">이미지 URL</label>
            <input type="text" class="form-input" id="mediaUrl" placeholder="https://..." style="background: var(--gray-50); color: var(--gray-900); border-color: var(--gray-300);">
          </div>
        `,
        link: `
          <div class="form-group">
            <label class="form-label" style="color: var(--gray-700);">버튼 텍스트</label>
            <input type="text" class="form-input" id="mediaTitle" placeholder="자세히 알아보기" style="background: var(--gray-50); color: var(--gray-900); border-color: var(--gray-300);">
          </div>
          <div class="form-group">
            <label class="form-label" style="color: var(--gray-700);">링크 URL</label>
            <input type="text" class="form-input" id="mediaUrl" placeholder="https://..." style="background: var(--gray-50); color: var(--gray-900); border-color: var(--gray-300);">
          </div>
        `,
        form: `
          <div class="form-group">
            <label class="form-label" style="color: var(--gray-700);">폼 제목</label>
            <input type="text" class="form-input" id="mediaTitle" placeholder="연락처를 남겨주세요" style="background: var(--gray-50); color: var(--gray-900); border-color: var(--gray-300);">
          </div>
          <div class="form-group">
            <label class="form-label" style="color: var(--gray-700);">입력 필드 (쉼표 구분)</label>
            <input type="text" class="form-input" id="mediaFields" placeholder="이름, 연락처, 이메일" style="background: var(--gray-50); color: var(--gray-900); border-color: var(--gray-300);">
          </div>
        `,
        text: `
          <div class="form-group">
            <label class="form-label" style="color: var(--gray-700);">텍스트 내용</label>
            <textarea class="form-input form-textarea" id="mediaContent" placeholder="추가할 텍스트" style="background: var(--gray-50); color: var(--gray-900); border-color: var(--gray-300);"></textarea>
          </div>
        `
      };

      const titles = {
        video: '🎬 영상 삽입',
        image: '🖼️ 이미지 삽입',
        link: '🔗 링크/버튼 삽입',
        form: '📝 입력폼 삽입',
        text: '✏️ 텍스트 추가'
      };

      title.textContent = titles[type];
      content.innerHTML = forms[type];
      modal.classList.add('visible');
    }

    function closeMediaModal() {
      document.getElementById('mediaModal').classList.remove('visible');
    }

    function confirmInsertMedia() {
      const preview = document.getElementById('proposalPreview');
      let html = '';

      switch (currentMediaType) {
        case 'video':
          const videoUrl = document.getElementById('mediaUrl').value;
          const videoId = videoUrl.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&]+)/)?.[1];
          if (videoId) {
            html = `<div style="margin: 20px 40px;"><iframe width="100%" height="400" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen style="border-radius: 12px;"></iframe></div>`;
          }
          break;
        case 'image':
          const imageUrl = document.getElementById('mediaUrl').value;
          html = `<div style="margin: 20px 40px;"><img src="${imageUrl}" style="width: 100%; border-radius: 12px;" alt="삽입된 이미지"></div>`;
          break;
        case 'link':
          const linkTitle = document.getElementById('mediaTitle').value;
          const linkUrl = document.getElementById('mediaUrl').value;
          html = `<div style="margin: 20px 40px; text-align: center;"><a href="${linkUrl}" target="_blank" style="display: inline-block; padding: 16px 40px; background: linear-gradient(135deg, #FFBE45, #F5A623, #E08A00); color: #0A0806; text-decoration: none; border-radius: 50px; font-weight: 700; font-size: 16px;">${linkTitle}</a></div>`;
          break;
        case 'form':
          const formTitle = document.getElementById('mediaTitle').value;
          const fields = document.getElementById('mediaFields').value.split(',').map(f => f.trim());
          html = `<div style="margin: 20px 40px; background: white; padding: 24px; border-radius: 16px;">
            <h4 style="font-size: 18px; font-weight: 700; margin-bottom: 20px; color: #191f28;">${formTitle}</h4>
            ${fields.map(f => `<div style="margin-bottom: 12px;"><label style="display: block; font-size: 13px; margin-bottom: 6px; color: #6b7684;">${f}</label><input type="text" style="width: 100%; padding: 12px; border: 1px solid #d1d6db; border-radius: 8px;" placeholder="${f} 입력"></div>`).join('')}
            <button style="width: 100%; padding: 14px; background: #7c3aed; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 8px;">제출하기</button>
          </div>`;
          break;
        case 'text':
          const textContent = document.getElementById('mediaContent').value;
          html = `<div style="margin: 20px 40px; background: rgba(124, 58, 237, 0.1); padding: 20px; border-radius: 12px; border-left: 4px solid #7c3aed;"><p style="margin: 0; color: white; line-height: 1.7;">${textContent.replace(/\n/g, '<br>')}</p></div>`;
          break;
      }

      if (html) {
        preview.insertAdjacentHTML('beforeend', html);
      }

      closeMediaModal();
    }

    // ===== 다운로드 =====
    function downloadPDF() {
      const element = document.getElementById('proposalPreview');
      if (!element.innerHTML.trim()) {
        alert('먼저 제안서를 생성해주세요.');
        return;
      }

      const opt = {
        margin: 0,
        filename: `맞춤제안서_${generatedProposal?.companyName || '모여라딜'}_${new Date().toISOString().split('T')[0]}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
      };

      html2pdf().set(opt).from(element).save();
    }

    function downloadHTML() {
      const element = document.getElementById('proposalPreview');
      if (!element.innerHTML.trim()) {
        alert('먼저 제안서를 생성해주세요.');
        return;
      }

      const html = `<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>맞춤 제안서 - ${generatedProposal?.companyName || '모여라딜'}</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Pretendard', sans-serif; background: #0A0806; }
  </style>
</head>
<body>
${element.innerHTML}
</body>
</html>`;

      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `맞춤제안서_${generatedProposal?.companyName || '모여라딜'}_${new Date().toISOString().split('T')[0]}.html`;
      a.click();
    }

    // ===== 초기화 =====
    function resetAll() {
      if (!confirm('모든 내용을 초기화하시겠습니까?')) return;

      document.getElementById('companyName').value = '';
      document.getElementById('contactName').value = '';
      document.getElementById('mainProducts').value = '';
      document.getElementById('notes').value = '';
      uploadedFiles = [];
      addedUrls = [];
      renderUploadedFiles();
      renderAddedUrls();

      document.getElementById('proposalPreview').innerHTML = '';
      document.getElementById('emptyState').style.display = 'block';
      generatedProposal = null;
    }

    // 드래그 앤 드롭
    const uploadArea = document.querySelector('.file-upload-area');
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.style.borderColor = 'var(--primary)';
      uploadArea.style.background = 'rgba(124, 58, 237, 0.1)';
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.style.borderColor = '';
      uploadArea.style.background = '';
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.style.borderColor = '';
      uploadArea.style.background = '';

      const files = e.dataTransfer.files;
      for (const file of files) {
        uploadedFiles.push(file);
        if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
          parseExcelFile(file);
        }
      }
      renderUploadedFiles();
    });
  </script>
</body>
</html>
