<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>셀러 제안서 분석 - 모여라딜</title>
    <link rel="icon" type="image/png" href="../../admin/favicon.png">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f5f5f5;
            --bg-card: #ffffff;
            --accent: #3b82f6;
            --accent-light: #60a5fa;
            --green: #10b981;
            --purple: #8b5cf6;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            padding: 20px 32px;
            color: white;
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-badge {
            background: rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-glass {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .btn-glass:hover {
            background: rgba(255,255,255,0.3);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px;
        }

        .page-header {
            margin-bottom: 32px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .page-desc {
            color: var(--text-muted);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 16px;
        }

        .stat-icon.blue { background: #dbeafe; color: var(--accent); }
        .stat-icon.green { background: #dcfce7; color: var(--green); }
        .stat-icon.purple { background: #f3e8ff; color: var(--purple); }
        .stat-icon.orange { background: #ffedd5; color: #f97316; }

        .stat-value {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-muted);
        }

        .coming-soon {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .coming-soon-icon {
            font-size: 64px;
            margin-bottom: 24px;
        }

        .coming-soon-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--accent);
        }

        .coming-soon-desc {
            color: var(--text-muted);
            line-height: 1.6;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
        }

        .loading i {
            font-size: 32px;
            margin-bottom: 16px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="list.html" class="logo">
                <span style="font-size: 24px;">🛍️</span>
                <span>모여라딜</span>
                <span class="logo-badge">셀러</span>
            </a>
            <a href="list.html" class="btn btn-glass">
                <i class="fas fa-arrow-left"></i> 목록으로
            </a>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h1 class="page-title">제안서 분석</h1>
            <p class="page-desc" id="proposalName">제안서 데이터를 분석합니다</p>
        </div>

        <div id="loading" class="loading">
            <i class="fas fa-spinner"></i>
            <p>데이터를 불러오는 중...</p>
        </div>

        <div id="content" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon blue">
                        <i class="fas fa-eye"></i>
                    </div>
                    <div class="stat-value" id="viewCount">0</div>
                    <div class="stat-label">총 조회수</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="stat-value" id="avgTime">-</div>
                    <div class="stat-label">평균 체류시간</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon purple">
                        <i class="fas fa-share-alt"></i>
                    </div>
                    <div class="stat-value" id="shareCount">0</div>
                    <div class="stat-label">공유 횟수</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon orange">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="stat-value" id="uniqueVisitors">0</div>
                    <div class="stat-label">고유 방문자</div>
                </div>
            </div>

            <div class="coming-soon">
                <div class="coming-soon-icon">📊</div>
                <h2 class="coming-soon-title">상세 분석 기능 준비 중</h2>
                <p class="coming-soon-desc">
                    페이지별 체류시간, 열람 패턴, 전환율 등<br>
                    상세 분석 기능이 곧 추가됩니다.
                </p>
            </div>
        </div>
    </div>

    <script>
        // Firebase 설정
        const firebaseConfig = {
            apiKey: "AIzaSyD_F0F6MBlMGcwBpVvFYsmztXaKKSeAv3Q",
            authDomain: "myd-db-test-1.firebaseapp.com",
            projectId: "myd-db-test-1",
            storageBucket: "myd-db-test-1.firebasestorage.app",
            messagingSenderId: "368468337741",
            appId: "1:368468337741:web:46d64e6a182aded8a45a5f"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const COLLECTION_NAME = 'sellerProposalDerivatives';

        // URL에서 제안서 ID 추출
        const urlParams = new URLSearchParams(window.location.search);
        const proposalId = urlParams.get('id');

        document.addEventListener('DOMContentLoaded', async () => {
            if (!proposalId) {
                showError();
                return;
            }

            try {
                const doc = await db.collection(COLLECTION_NAME).doc(proposalId).get();

                if (!doc.exists) {
                    showError();
                    return;
                }

                const data = doc.data();

                // 제안서 이름 표시
                document.getElementById('proposalName').textContent =
                    `${data.sellerName || '제목 없음'} 제안서 분석`;

                // 통계 표시
                document.getElementById('viewCount').textContent = data.viewCount || 0;
                document.getElementById('shareCount').textContent = data.sharedAt ? 1 : 0;
                document.getElementById('uniqueVisitors').textContent = data.viewCount || 0;

                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

            } catch (err) {
                console.error('데이터 로드 실패:', err);
                showError();
            }
        });

        function showError() {
            document.getElementById('loading').innerHTML = `
                <div style="font-size: 64px; margin-bottom: 24px;">😢</div>
                <p style="font-size: 18px; font-weight: 600; margin-bottom: 8px;">데이터를 불러올 수 없습니다</p>
                <p>제안서가 존재하지 않거나 삭제되었을 수 있습니다.</p>
                <a href="list.html" style="display: inline-block; margin-top: 24px; padding: 12px 24px; background: var(--accent); color: white; border-radius: 10px; text-decoration: none;">목록으로 돌아가기</a>
            `;
        }
    </script>
</body>
</html>
