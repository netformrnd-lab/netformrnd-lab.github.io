<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>셀러 제안서 작성 - 모여라딜</title>
    <link rel="icon" type="image/png" href="../../admin/favicon.png">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f5f5f5;
            --bg-card: #ffffff;
            --accent: #3b82f6;
            --accent-light: #60a5fa;
            --green: #10b981;
            --purple: #8b5cf6;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            padding: 20px 32px;
            color: white;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-badge {
            background: rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-white {
            background: white;
            color: var(--accent);
        }

        .btn-white:hover {
            background: #f8f8f8;
        }

        .btn-glass {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .btn-glass:hover {
            background: rgba(255,255,255,0.3);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 32px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .page-desc {
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        .form-section {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: var(--accent);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }

        .form-label .required {
            color: #ef4444;
            margin-left: 4px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .form-input::placeholder {
            color: #94a3b8;
        }

        textarea.form-input {
            min-height: 120px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .coming-soon-card {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border: 2px dashed var(--accent);
            border-radius: 16px;
            padding: 60px 40px;
            text-align: center;
        }

        .coming-soon-icon {
            font-size: 64px;
            margin-bottom: 24px;
        }

        .coming-soon-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--accent);
        }

        .coming-soon-desc {
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            padding: 14px 28px;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 32px;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .btn-outline:hover {
            background: var(--bg);
            color: var(--text);
        }

        /* 토스트 */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 16px 32px;
            background: var(--text);
            color: white;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            z-index: 10000;
            opacity: 0;
            transition: all 0.3s;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success { background: var(--green); }
        .toast.error { background: #ef4444; }

        @media (max-width: 768px) {
            .container { padding: 20px; }
            .form-row { grid-template-columns: 1fr; }
            .header-inner { flex-direction: column; gap: 16px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="list.html" class="logo">
                <span style="font-size: 24px;">🛍️</span>
                <span>모여라딜</span>
                <span class="logo-badge">셀러</span>
            </a>
            <div class="header-actions">
                <a href="list.html" class="btn btn-glass">
                    <i class="fas fa-arrow-left"></i> 목록으로
                </a>
                <button class="btn btn-white" onclick="saveDraft()">
                    <i class="fas fa-save"></i> 임시저장
                </button>
            </div>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title">셀러 맞춤 제안서 작성</h1>
        <p class="page-desc">셀러에게 전달할 맞춤 제안서를 작성하세요</p>

        <!-- 셀러 정보 입력 섹션 -->
        <div class="form-section">
            <h2 class="section-title">
                <i class="fas fa-store"></i>
                셀러 정보
            </h2>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">셀러명 <span class="required">*</span></label>
                    <input type="text" class="form-input" id="sellerName" placeholder="셀러 이름 또는 상호명">
                </div>
                <div class="form-group">
                    <label class="form-label">스토어명</label>
                    <input type="text" class="form-input" id="storeName" placeholder="운영 중인 스토어명">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">카테고리</label>
                    <select class="form-input" id="category">
                        <option value="">카테고리 선택</option>
                        <option value="식품">식품</option>
                        <option value="뷰티">뷰티</option>
                        <option value="패션">패션</option>
                        <option value="리빙">리빙</option>
                        <option value="유아동">유아동</option>
                        <option value="건강">건강</option>
                        <option value="디지털">디지털</option>
                        <option value="기타">기타</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">담당자 연락처</label>
                    <input type="text" class="form-input" id="contactInfo" placeholder="연락처 또는 이메일">
                </div>
            </div>
        </div>

        <!-- Coming Soon 섹션 -->
        <div class="coming-soon-card">
            <div class="coming-soon-icon">🚀</div>
            <h2 class="coming-soon-title">셀러 맞춤 제안서 기능 준비 중</h2>
            <p class="coming-soon-desc">
                셀러 타겟 맞춤 제안서 기능이 곧 추가됩니다.<br>
                현재는 기본 정보 입력 및 임시저장만 가능합니다.
            </p>
            <a href="../../supplier/custom-proposal/create.html" class="btn btn-primary">
                <i class="fas fa-arrow-right"></i> 공급사 제안서로 이동
            </a>
        </div>

        <div class="actions">
            <a href="list.html" class="btn btn-outline">
                <i class="fas fa-times"></i> 취소
            </a>
            <button class="btn btn-primary" onclick="saveDraft()">
                <i class="fas fa-save"></i> 임시저장
            </button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // Firebase 설정
        const firebaseConfig = {
            apiKey: "AIzaSyD_F0F6MBlMGcwBpVvFYsmztXaKKSeAv3Q",
            authDomain: "myd-db-test-1.firebaseapp.com",
            projectId: "myd-db-test-1",
            storageBucket: "myd-db-test-1.firebasestorage.app",
            messagingSenderId: "368468337741",
            appId: "1:368468337741:web:46d64e6a182aded8a45a5f"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const DRAFT_KEY = 'sellerProposalDraft';

        // 페이지 로드 시 임시저장 복원
        document.addEventListener('DOMContentLoaded', () => {
            loadDraft();
        });

        // 임시저장 로드
        function loadDraft() {
            const draftData = localStorage.getItem(DRAFT_KEY);
            if (draftData) {
                try {
                    const draft = JSON.parse(draftData);
                    document.getElementById('sellerName').value = draft.sellerName || '';
                    document.getElementById('storeName').value = draft.storeName || '';
                    document.getElementById('category').value = draft.category || '';
                    document.getElementById('contactInfo').value = draft.contactInfo || '';
                } catch (e) {
                    console.error('임시저장 로드 실패:', e);
                }
            }
        }

        // 임시저장
        function saveDraft() {
            const draft = {
                sellerName: document.getElementById('sellerName').value,
                storeName: document.getElementById('storeName').value,
                category: document.getElementById('category').value,
                contactInfo: document.getElementById('contactInfo').value,
                savedAt: Date.now()
            };

            localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
            showToast('임시저장되었습니다', 'success');
        }

        // 토스트
        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
