<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | 모여라딜 파트너</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="모여라딜 파트너 로그인 - 셀러 또는 공급사로 로그인하세요.">
    <meta name="robots" content="noindex, nofollow">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://ecimg.cafe24img.com/pg2246b37345376080/moyeora02/web/upload/wz/logo1127.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #050508;
            --bg-card: #0f0f14;
            --accent-primary: #fc9600;
            --accent-secondary: #ff7a00;
            --accent-gradient: linear-gradient(135deg, #fc9600 0%, #ff7a00 100%);
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --border-color: rgba(252, 150, 0, 0.15);
            --purple-primary: #6366f1;
            --purple-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Background Effects */
        .bg-gradient {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 30% 20%, rgba(252, 150, 0, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 70% 80%, rgba(99, 102, 241, 0.06), transparent);
            pointer-events: none;
            z-index: 0;
        }

        .grid-pattern {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        /* Container */
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        /* Logo */
        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            height: 36px;
            margin-bottom: 12px;
        }

        .logo-subtitle {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* Card */
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px 32px;
        }

        .login-title {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }

        .login-desc {
            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 32px;
        }

        /* Selection Cards */
        .selection-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .selection-card {
            background: rgba(255, 255, 255, 0.02);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 28px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .selection-card::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .selection-card.seller::before {
            background: linear-gradient(135deg, rgba(252, 150, 0, 0.1), rgba(255, 122, 0, 0.05));
        }

        .selection-card.supplier::before {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.05));
        }

        .selection-card:hover {
            transform: translateY(-4px);
        }

        .selection-card:hover::before {
            opacity: 1;
        }

        .selection-card.seller:hover,
        .selection-card.seller.active {
            border-color: var(--accent-primary);
            box-shadow: 0 8px 32px rgba(252, 150, 0, 0.2);
        }

        .selection-card.supplier:hover,
        .selection-card.supplier.active {
            border-color: var(--purple-primary);
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.2);
        }

        .selection-card.active::before {
            opacity: 1;
        }

        .selection-icon {
            font-size: 40px;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .selection-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
            position: relative;
            z-index: 1;
        }

        .selection-card.seller .selection-title {
            color: var(--accent-primary);
        }

        .selection-card.supplier .selection-title {
            color: var(--purple-primary);
        }

        .selection-desc {
            font-size: 12px;
            color: var(--text-muted);
            position: relative;
            z-index: 1;
        }

        .selection-check {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .selection-card.seller .selection-check {
            background: var(--accent-gradient);
            color: white;
        }

        .selection-card.supplier .selection-check {
            background: var(--purple-gradient);
            color: white;
        }

        .selection-card.active .selection-check {
            opacity: 1;
        }

        /* Login Button */
        .login-btn {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            pointer-events: none;
        }

        .login-btn.active {
            pointer-events: auto;
        }

        .login-btn.seller-active {
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 4px 20px rgba(252, 150, 0, 0.4);
        }

        .login-btn.supplier-active {
            background: var(--purple-gradient);
            color: white;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .login-btn.active:hover {
            transform: translateY(-2px);
        }

        .login-btn.seller-active:hover {
            box-shadow: 0 8px 30px rgba(252, 150, 0, 0.5);
        }

        .login-btn.supplier-active:hover {
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.5);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        .divider-text {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Links */
        .links {
            display: flex;
            justify-content: center;
            gap: 24px;
        }

        .link {
            font-size: 13px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s;
        }

        .link:hover {
            color: var(--accent-primary);
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 32px;
        }

        .footer-text {
            font-size: 12px;
            color: var(--text-muted);
        }

        .footer-link {
            color: var(--text-secondary);
            text-decoration: none;
        }

        .footer-link:hover {
            color: var(--accent-primary);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
            }

            .selection-grid {
                grid-template-columns: 1fr;
            }

            .selection-card {
                padding: 24px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="grid-pattern"></div>

    <div class="login-container">
        <div class="logo-section">
            <a href="../index.html">
                <img src="https://ecimg.cafe24img.com/pg2246b37345376080/moyeora02/web/upload/wz/logo1127.png" alt="모여라딜" class="logo">
            </a>
            <p class="logo-subtitle">파트너 포털</p>
        </div>

        <div class="login-card">
            <h1 class="login-title">로그인</h1>
            <p class="login-desc">로그인 유형을 선택해주세요</p>

            <div class="selection-grid">
                <div class="selection-card seller" onclick="selectType('seller')">
                    <span class="selection-check">✓</span>
                    <div class="selection-icon">🛍️</div>
                    <div class="selection-title">셀러</div>
                    <div class="selection-desc">공동구매를 진행하는<br>인플루언서/엠버서더</div>
                </div>
                <div class="selection-card supplier" onclick="selectType('supplier')">
                    <span class="selection-check">✓</span>
                    <div class="selection-icon">🏭</div>
                    <div class="selection-title">공급사</div>
                    <div class="selection-desc">제품을 공급하는<br>브랜드/제조사</div>
                </div>
            </div>

            <button type="button" class="login-btn" id="loginBtn" onclick="goToLogin()">
                <span id="loginBtnText">유형을 선택해주세요</span>
                <span>→</span>
            </button>

            <div class="divider">
                <div class="divider-line"></div>
                <span class="divider-text">또는</span>
                <div class="divider-line"></div>
            </div>

            <div class="links">
                <a href="../seller.html" class="link">셀러 입점 안내</a>
                <a href="../supplier.html" class="link">공급사 입점 안내</a>
            </div>
        </div>

        <div class="footer">
            <p class="footer-text">
                <a href="../index.html" class="footer-link">모여라딜 파트너</a> ·
                주식회사 넷폼알앤디
            </p>
        </div>
    </div>

    <script>
        let selectedType = null;

        function selectType(type) {
            selectedType = type;

            // Remove active from all cards
            document.querySelectorAll('.selection-card').forEach(card => {
                card.classList.remove('active');
            });

            // Add active to selected card
            document.querySelector(`.selection-card.${type}`).classList.add('active');

            // Update button
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('loginBtnText');

            btn.classList.remove('seller-active', 'supplier-active');
            btn.classList.add('active');

            if (type === 'seller') {
                btn.classList.add('seller-active');
                btnText.textContent = '셀러 로그인하기';
            } else {
                btn.classList.add('supplier-active');
                btnText.textContent = '공급사 로그인하기';
            }
        }

        function goToLogin() {
            if (!selectedType) return;

            if (selectedType === 'seller') {
                // 셀러 로그인 페이지로 이동
                window.location.href = 'https://moyeoradeal.kr/seller/login/';
            } else {
                // 공급사 로그인 페이지로 이동
                window.location.href = 'https://moyeoradeal.kr/supplier/login/';
            }
        }
    </script>
</body>
</html>
