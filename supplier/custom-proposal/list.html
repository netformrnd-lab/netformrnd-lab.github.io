<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 제안서 - 모여라딜</title>
    <link rel="icon" type="image/png" href="../../admin/favicon.png">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f5f5f5;
            --bg-card: #ffffff;
            --accent: #f97316;
            --accent-light: #fb923c;
            --green: #10b981;
            --blue: #3b82f6;
            --purple: #8b5cf6;
            --red: #ef4444;
            --yellow: #f59e0b;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            padding: 20px 32px;
            color: white;
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-white {
            background: white;
            color: var(--accent);
        }

        .btn-white:hover {
            background: #f8f8f8;
            transform: translateY(-1px);
        }

        .btn-glass {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .btn-glass:hover {
            background: rgba(255,255,255,0.3);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px;
        }

        .page-header {
            margin-bottom: 32px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .page-desc {
            font-size: 16px;
            color: var(--text-muted);
        }

        /* 탭 네비게이션 */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0;
        }

        .tab {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            background: none;
            border: none;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }

        .tab:hover {
            color: var(--text);
        }

        .tab.active {
            color: var(--accent);
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent);
            border-radius: 3px 3px 0 0;
        }

        .tab .badge {
            background: var(--border);
            color: var(--text-muted);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            margin-left: 8px;
        }

        .tab.active .badge {
            background: var(--accent);
            color: white;
        }

        /* 카드 그리드 */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        /* 임시저장 카드 */
        .draft-card {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border: 2px dashed var(--yellow);
            border-radius: 16px;
            padding: 24px;
            position: relative;
        }

        .draft-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background: var(--yellow);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .draft-card h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #92400e;
        }

        .draft-meta {
            font-size: 13px;
            color: #b45309;
            margin-bottom: 16px;
        }

        .draft-info {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .draft-info-item {
            background: rgba(255,255,255,0.7);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #92400e;
        }

        .draft-actions {
            display: flex;
            gap: 8px;
        }

        .draft-actions .btn {
            flex: 1;
            justify-content: center;
            padding: 12px;
        }

        .btn-yellow {
            background: var(--yellow);
            color: white;
        }

        .btn-yellow:hover {
            background: #d97706;
        }

        .btn-outline-yellow {
            background: transparent;
            border: 1px solid var(--yellow);
            color: #b45309;
        }

        .btn-outline-yellow:hover {
            background: rgba(245, 158, 11, 0.1);
        }

        /* 제안서 카드 */
        .proposal-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid var(--border);
            transition: all 0.2s;
        }

        .proposal-card:hover {
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            transform: translateY(-2px);
        }

        .proposal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .proposal-company {
            font-size: 18px;
            font-weight: 700;
        }

        .proposal-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-sent {
            background: #dbeafe;
            color: var(--blue);
        }

        .status-viewed {
            background: #dcfce7;
            color: var(--green);
        }

        .status-complete {
            background: #f3e8ff;
            color: var(--purple);
        }

        .proposal-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 16px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .proposal-meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .proposal-meta-item i {
            width: 16px;
            text-align: center;
        }

        .proposal-stats {
            display: flex;
            gap: 24px;
            padding: 16px;
            background: var(--bg);
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .stat-item {
            text-align: center;
            flex: 1;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* 타임라인 스타일 */
        .proposal-timeline {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px 16px;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 12px;
        }

        .timeline-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
        }

        .timeline-item i {
            width: 16px;
            text-align: center;
            font-size: 11px;
        }

        .timeline-item.completed i {
            color: var(--green);
        }

        .timeline-item.shared i {
            color: var(--blue);
        }

        .timeline-item.viewed i {
            color: var(--purple);
        }

        .timeline-label {
            min-width: 60px;
            font-weight: 600;
            color: var(--text);
        }

        .timeline-time {
            color: var(--text-muted);
        }

        .timeline-item.pending {
            opacity: 0.5;
        }

        /* 데이터 대시보드 버튼 */
        .btn-analytics {
            background: linear-gradient(135deg, var(--purple) 0%, #7c3aed 100%);
            color: white;
        }

        .btn-analytics:hover {
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
        }

        .proposal-actions {
            display: flex;
            gap: 8px;
        }

        .proposal-actions .btn {
            flex: 1;
            justify-content: center;
            padding: 12px;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-light);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .btn-outline:hover {
            background: var(--bg);
            color: var(--text);
        }

        /* 빈 상태 */
        .empty-state {
            text-align: center;
            padding: 80px 40px;
            background: var(--bg-card);
            border-radius: 20px;
            border: 2px dashed var(--border);
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 24px;
        }

        .empty-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .empty-desc {
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        /* 로딩 */
        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
        }

        .loading i {
            font-size: 32px;
            margin-bottom: 16px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 토스트 */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 16px 32px;
            background: var(--text);
            color: white;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            z-index: 10000;
            opacity: 0;
            transition: all 0.3s;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success {
            background: var(--green);
        }

        .toast.error {
            background: var(--red);
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }

            .header-inner {
                flex-direction: column;
                gap: 16px;
            }

            .tabs {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            .tab {
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="../../admin/index.html" class="logo">
                <span style="font-size: 24px;">🛒</span>
                <span>모여라딜</span>
            </a>
            <div class="header-actions">
                <a href="create.html" class="btn btn-white">
                    <i class="fas fa-plus"></i> 새 제안서 만들기
                </a>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h1 class="page-title">내 제안서</h1>
            <p class="page-desc">생성한 맞춤 제안서와 임시저장본을 관리하세요</p>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="all" onclick="switchTab('all')">
                전체
                <span class="badge" id="allCount">0</span>
            </button>
            <button class="tab" data-tab="draft" onclick="switchTab('draft')">
                임시저장
                <span class="badge" id="draftCount">0</span>
            </button>
            <button class="tab" data-tab="sent" onclick="switchTab('sent')">
                발송됨
                <span class="badge" id="sentCount">0</span>
            </button>
            <button class="tab" data-tab="viewed" onclick="switchTab('viewed')">
                열람됨
                <span class="badge" id="viewedCount">0</span>
            </button>
        </div>

        <div id="content">
            <div class="loading">
                <i class="fas fa-spinner"></i>
                <p>제안서를 불러오는 중...</p>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // Firebase 설정
        const firebaseConfig = {
            apiKey: "AIzaSyD_F0F6MBlMGcwBpVvFYsmztXaKKSeAv3Q",
            authDomain: "myd-db-test-1.firebaseapp.com",
            projectId: "myd-db-test-1",
            storageBucket: "myd-db-test-1.firebasestorage.app",
            messagingSenderId: "368468337741",
            appId: "1:368468337741:web:46d64e6a182aded8a45a5f"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let proposals = [];
        let draft = null;
        let currentTab = 'all';

        // 초기화
        document.addEventListener('DOMContentLoaded', async () => {
            await loadData();
        });

        // 데이터 로드
        async function loadData() {
            try {
                // Firestore에서 제안서 목록 로드
                const snapshot = await db.collection('proposalDerivatives')
                    .orderBy('createdAt', 'desc')
                    .limit(100)
                    .get();

                proposals = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));

                // localStorage에서 임시저장 로드
                const draftData = localStorage.getItem('proposalDraft');
                if (draftData) {
                    try {
                        draft = JSON.parse(draftData);
                    } catch (e) {
                        draft = null;
                    }
                }

                updateCounts();
                renderContent();

            } catch (err) {
                console.error('데이터 로드 실패:', err);
                document.getElementById('content').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">😢</div>
                        <div class="empty-title">데이터를 불러올 수 없습니다</div>
                        <div class="empty-desc">잠시 후 다시 시도해주세요</div>
                    </div>
                `;
            }
        }

        // 카운트 업데이트
        function updateCounts() {
            const draftCount = draft ? 1 : 0;
            const sentCount = proposals.filter(p => !p.viewCount || p.viewCount === 0).length;
            const viewedCount = proposals.filter(p => p.viewCount && p.viewCount > 0).length;

            document.getElementById('draftCount').textContent = draftCount;
            document.getElementById('sentCount').textContent = sentCount;
            document.getElementById('viewedCount').textContent = viewedCount;
            document.getElementById('allCount').textContent = proposals.length + draftCount;
        }

        // 탭 전환
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
            renderContent();
        }

        // 콘텐츠 렌더링
        function renderContent() {
            const content = document.getElementById('content');
            let filteredProposals = [...proposals];
            let showDraft = false;

            switch (currentTab) {
                case 'draft':
                    filteredProposals = [];
                    showDraft = !!draft;
                    break;
                case 'sent':
                    filteredProposals = proposals.filter(p => !p.viewCount || p.viewCount === 0);
                    break;
                case 'viewed':
                    filteredProposals = proposals.filter(p => p.viewCount && p.viewCount > 0);
                    break;
                case 'all':
                default:
                    showDraft = !!draft;
                    break;
            }

            if (!showDraft && filteredProposals.length === 0) {
                content.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📝</div>
                        <div class="empty-title">${getEmptyTitle()}</div>
                        <div class="empty-desc">${getEmptyDesc()}</div>
                        <a href="create.html" class="btn btn-primary">
                            <i class="fas fa-plus"></i> 새 제안서 만들기
                        </a>
                    </div>
                `;
                return;
            }

            let html = '<div class="cards-grid">';

            // 임시저장 카드
            if (showDraft && draft) {
                html += renderDraftCard(draft);
            }

            // 제안서 카드들
            filteredProposals.forEach(proposal => {
                html += renderProposalCard(proposal);
            });

            html += '</div>';
            content.innerHTML = html;
        }

        function getEmptyTitle() {
            switch (currentTab) {
                case 'draft': return '임시저장된 제안서가 없습니다';
                case 'sent': return '발송된 제안서가 없습니다';
                case 'viewed': return '열람된 제안서가 없습니다';
                default: return '아직 제안서가 없습니다';
            }
        }

        function getEmptyDesc() {
            switch (currentTab) {
                case 'draft': return '제안서 작성 중 임시저장하면 여기에 표시됩니다';
                case 'sent': return '제안서를 생성하면 여기에 표시됩니다';
                case 'viewed': return '공급사가 제안서를 열람하면 여기에 표시됩니다';
                default: return '첫 번째 맞춤 제안서를 만들어보세요';
            }
        }

        // 임시저장 카드 렌더링
        function renderDraftCard(draft) {
            const savedAt = draft.savedAt ? new Date(draft.savedAt).toLocaleString('ko-KR') : '알 수 없음';
            const companyName = draft.companyName || '제목 없음';
            const category = draft.category || '';
            const productsCount = draft.selectedProducts?.length || 0;
            const pointsCount = draft.appealPoints?.length || 0;

            return `
                <div class="draft-card">
                    <span class="draft-badge"><i class="fas fa-clock"></i> 임시저장</span>
                    <h3>${companyName}</h3>
                    <div class="draft-meta">
                        <i class="fas fa-save"></i> ${savedAt}
                    </div>
                    <div class="draft-info">
                        ${category ? `<span class="draft-info-item"><i class="fas fa-tag"></i> ${category}</span>` : ''}
                        ${productsCount > 0 ? `<span class="draft-info-item"><i class="fas fa-box"></i> 상품 ${productsCount}개</span>` : ''}
                        ${pointsCount > 0 ? `<span class="draft-info-item"><i class="fas fa-star"></i> 소구점 ${pointsCount}개</span>` : ''}
                    </div>
                    <div class="draft-actions">
                        <a href="create.html" class="btn btn-yellow">
                            <i class="fas fa-edit"></i> 이어서 작성
                        </a>
                        <button class="btn btn-outline-yellow" onclick="deleteDraft()">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        // 제안서 카드 렌더링
        function renderProposalCard(proposal) {
            const viewCount = proposal.viewCount || 0;
            const stage = proposal.stage || 'sent';

            // 시간 포맷팅 함수
            const formatDateTime = (timestamp) => {
                if (!timestamp) return null;
                const date = new Date(timestamp);
                const now = new Date();
                const diffMs = now - date;
                const diffMins = Math.floor(diffMs / 60000);
                const diffHours = Math.floor(diffMs / 3600000);
                const diffDays = Math.floor(diffMs / 86400000);

                if (diffMins < 1) return '방금 전';
                if (diffMins < 60) return `${diffMins}분 전`;
                if (diffHours < 24) return `${diffHours}시간 전`;
                if (diffDays < 7) return `${diffDays}일 전`;

                return date.toLocaleDateString('ko-KR', {
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            };

            const createdAtFormatted = formatDateTime(proposal.createdAt) || '-';
            const sharedAtFormatted = formatDateTime(proposal.sharedAt);
            const lastViewedAtFormatted = formatDateTime(proposal.lastViewedAt);

            let statusClass = 'status-sent';
            let statusText = '발송됨';

            if (stage === 'onboarding_complete') {
                statusClass = 'status-complete';
                statusText = '입점완료';
            } else if (viewCount > 0) {
                statusClass = 'status-viewed';
                statusText = '열람됨';
            }

            const productsCount = proposal.products?.length || 0;
            const pointsCount = proposal.appealPoints?.length || 0;

            return `
                <div class="proposal-card">
                    <div class="proposal-header">
                        <div class="proposal-company">${proposal.companyName || '제목 없음'}</div>
                        <span class="proposal-status ${statusClass}">${statusText}</span>
                    </div>
                    <div class="proposal-meta">
                        ${proposal.category ? `
                        <span class="proposal-meta-item">
                            <i class="fas fa-tag"></i> ${proposal.category}
                        </span>
                        ` : ''}
                        <span class="proposal-meta-item">
                            <i class="fas fa-user"></i> ${proposal.managerName || '-'}
                        </span>
                    </div>
                    <div class="proposal-timeline">
                        <div class="timeline-item completed">
                            <i class="fas fa-check-circle"></i>
                            <span class="timeline-label">작성완료</span>
                            <span class="timeline-time">${createdAtFormatted}</span>
                        </div>
                        <div class="timeline-item ${sharedAtFormatted ? 'shared' : 'pending'}">
                            <i class="fas fa-share-alt"></i>
                            <span class="timeline-label">링크공유</span>
                            <span class="timeline-time">${sharedAtFormatted || '아직 공유 안됨'}</span>
                        </div>
                        <div class="timeline-item ${lastViewedAtFormatted ? 'viewed' : 'pending'}">
                            <i class="fas fa-eye"></i>
                            <span class="timeline-label">마지막열람</span>
                            <span class="timeline-time">${lastViewedAtFormatted || '아직 열람 안됨'}</span>
                            ${viewCount > 0 ? `<span style="margin-left: auto; color: var(--purple); font-weight: 600;">(${viewCount}회)</span>` : ''}
                        </div>
                    </div>
                    <div class="proposal-stats">
                        <div class="stat-item">
                            <div class="stat-value">${viewCount}</div>
                            <div class="stat-label">조회수</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${productsCount}</div>
                            <div class="stat-label">상품</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${pointsCount}</div>
                            <div class="stat-label">소구점</div>
                        </div>
                    </div>
                    <div class="proposal-actions">
                        <a href="view.html?id=${proposal.id}" class="btn btn-primary" target="_blank">
                            <i class="fas fa-eye"></i> 보기
                        </a>
                        <button class="btn btn-outline" onclick="copyLink('${proposal.id}')">
                            <i class="fas fa-link"></i> 공유
                        </button>
                        <a href="analytics.html?id=${proposal.id}" class="btn btn-analytics">
                            <i class="fas fa-chart-bar"></i> 분석
                        </a>
                    </div>
                </div>
            `;
        }

        // 임시저장 삭제
        function deleteDraft() {
            if (confirm('임시저장된 내용을 삭제하시겠습니까?')) {
                localStorage.removeItem('proposalDraft');
                draft = null;
                updateCounts();
                renderContent();
                showToast('임시저장이 삭제되었습니다', 'success');
            }
        }

        // 링크 복사 (첫 공유 시간 기록)
        async function copyLink(id) {
            const url = `${window.location.origin}/supplier/custom-proposal/view.html?id=${id}`;

            // 클립보드에 복사
            try {
                await navigator.clipboard.writeText(url);
            } catch {
                // 폴백: textarea 사용
                const textarea = document.createElement('textarea');
                textarea.value = url;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
            }

            // 첫 공유 시간 기록 (아직 없는 경우에만)
            const proposal = proposals.find(p => p.id === id);
            if (proposal && !proposal.sharedAt) {
                try {
                    const now = Date.now();
                    await db.collection('proposalDerivatives').doc(id).update({
                        sharedAt: now
                    });
                    proposal.sharedAt = now;
                    renderContent(); // UI 업데이트
                    showToast('링크가 복사되었습니다 (첫 공유 기록됨)', 'success');
                } catch (err) {
                    console.error('공유 시간 저장 실패:', err);
                    showToast('링크가 복사되었습니다', 'success');
                }
            } else {
                showToast('링크가 복사되었습니다', 'success');
            }
        }

        // 토스트
        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
