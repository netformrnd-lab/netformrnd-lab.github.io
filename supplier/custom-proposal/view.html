<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모여라딜 × 공급사 맞춤 제안서</title>
    <link rel="icon" type="image/png" href="../../admin/favicon.png">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-dark: #0a0a12;
            --bg-card: #12121f;
            --bg-light: #f8fafc;
            --accent: #f97316;
            --accent-light: #fb923c;
            --accent-glow: rgba(249, 115, 22, 0.3);
            --purple: #8b5cf6;
            --green: #10b981;
            --blue: #3b82f6;
            --text: #ffffff;
            --text-muted: #94a3b8;
            --text-dark: #1e293b;
            --border: #27272a;
        }

        html {
            scroll-behavior: smooth;
            scroll-snap-type: y mandatory;
        }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            overflow-x: hidden;
        }

        /* ===== 슬라이드 기본 ===== */
        .slide {
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            scroll-snap-align: start;
            position: relative;
            overflow: hidden;
            padding: 60px 80px;
        }

        .slide-content {
            max-width: 1200px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        /* 배경 오브 */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
        }

        /* 섹션 공통 */
        .section-tag {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 16px;
            color: var(--accent);
        }

        .section-title {
            font-size: clamp(32px, 4vw, 48px);
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 24px;
        }

        .section-title .highlight {
            color: var(--accent);
        }

        .section-desc {
            font-size: 18px;
            color: var(--text-muted);
            line-height: 1.8;
            margin-bottom: 48px;
        }

        /* ===== 슬라이드 1: 커버 ===== */
        .slide-cover {
            background: linear-gradient(135deg, #0a0a12 0%, #131328 100%);
        }

        .slide-cover .orb-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(249, 115, 22, 0.15), transparent 70%);
            top: -20%;
            right: -10%;
        }

        .cover-badge {
            display: inline-block;
            padding: 8px 20px;
            background: rgba(249, 115, 22, 0.15);
            border: 1px solid rgba(249, 115, 22, 0.3);
            border-radius: 100px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-light);
            margin-bottom: 32px;
        }

        .cover-supplier {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .cover-title {
            font-size: clamp(40px, 5vw, 64px);
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 24px;
        }

        .cover-subtitle {
            font-size: clamp(16px, 2vw, 20px);
            color: var(--text-muted);
            line-height: 1.8;
            margin-bottom: 48px;
            max-width: 600px;
        }

        .cover-tags {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .cover-tag {
            padding: 12px 24px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .cover-meta {
            position: absolute;
            bottom: 60px;
            right: 80px;
            font-size: 13px;
            color: var(--text-muted);
        }

        /* ===== 슬라이드 2: 문제점 ===== */
        .slide-problem {
            background: var(--bg-light);
        }

        .problem-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-bottom: 48px;
        }

        .problem-card {
            background: #fff;
            border-radius: 20px;
            padding: 36px 28px;
            text-align: center;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            transition: all 0.4s;
        }

        .problem-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.1);
        }

        .problem-icon {
            width: 72px;
            height: 72px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px;
        }

        .problem-card h3 {
            font-size: 17px;
            font-weight: 700;
            color: #ef4444;
            margin-bottom: 12px;
        }

        .problem-card p {
            font-size: 14px;
            color: #64748b;
            line-height: 1.7;
        }

        /* ===== 슬라이드 3: 솔루션 비교 ===== */
        .slide-solution {
            background: linear-gradient(135deg, #0a0a12 0%, #0f0f20 100%);
        }

        .solution-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
        }

        .solution-card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 40px;
            position: relative;
        }

        .solution-card.old {
            border: 1px solid rgba(239, 68, 68, 0.2);
            opacity: 0.85;
        }

        .solution-card.new {
            border: 2px solid var(--accent);
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.1), var(--bg-card));
        }

        .solution-card-header {
            text-align: center;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .solution-card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .solution-card.old .solution-card-title { color: #ef4444; }
        .solution-card.new .solution-card-title { color: var(--accent); }

        .solution-list {
            list-style: none;
        }

        .solution-list li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            font-size: 14px;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .solution-list li:last-child { border-bottom: none; }

        .solution-list li.highlight {
            color: var(--text);
            font-weight: 600;
        }

        .solution-list .icon { font-size: 16px; }
        .solution-card.old .icon { color: #ef4444; }
        .solution-card.new .icon { color: var(--green); }

        /* ===== 슬라이드 4+: 상품별 개별 슬라이드 ===== */
        .slide-product-single {
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
        }

        .product-single-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .product-single-hero {
            position: relative;
        }

        .product-single-image {
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, #1e1e30, #2a2a40);
            border-radius: 32px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 120px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 2px solid var(--border);
            position: relative;
        }

        .product-single-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-single-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: var(--accent);
            color: white;
            font-size: 14px;
            font-weight: 700;
            border-radius: 12px;
            z-index: 10;
        }

        .product-single-discount {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            background: linear-gradient(135deg, var(--green), #059669);
            color: white;
            font-size: 18px;
            font-weight: 800;
            border-radius: 12px;
            z-index: 10;
        }

        .product-single-info {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .product-single-header {
            margin-bottom: 8px;
        }

        .product-single-index {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(249, 115, 22, 0.15);
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 16px;
        }

        .product-single-name {
            font-size: clamp(28px, 4vw, 42px);
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 16px;
        }

        .product-single-price {
            display: flex;
            align-items: baseline;
            gap: 16px;
            flex-wrap: wrap;
        }

        .product-single-original {
            font-size: 18px;
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .product-single-deal {
            font-size: 32px;
            font-weight: 800;
            color: var(--accent);
        }

        .product-single-save {
            padding: 6px 14px;
            background: rgba(16, 185, 129, 0.15);
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            color: var(--green);
        }

        /* 개별 상품 공구 전략 */
        .product-strategy-box {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 28px;
            border: 1px solid var(--border);
        }

        .product-strategy-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .product-strategy-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .product-strategy-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .product-strategy-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .product-strategy-content h4 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .product-strategy-content p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .product-strategy-content p strong {
            color: var(--accent);
            font-weight: 700;
        }

        .product-strategy-item.highlight-strategy {
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.1), rgba(249, 115, 22, 0.05));
            border: 1px solid rgba(249, 115, 22, 0.3);
        }

        /* AI 전략 요약 */
        .ai-strategy-summary {
            margin-top: 16px;
            padding: 16px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(139, 92, 246, 0.05));
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 12px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 13px;
            line-height: 1.7;
            color: var(--text);
        }

        .ai-strategy-summary i {
            color: #8b5cf6;
            font-size: 18px;
            margin-top: 2px;
            flex-shrink: 0;
        }

        /* 전환 팁 */
        .conversion-tip {
            margin-top: 12px;
            padding: 12px 16px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(16, 185, 129, 0.05));
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--text);
        }

        .conversion-tip i {
            color: var(--green);
            font-size: 14px;
        }

        .conversion-tip strong {
            color: var(--green);
        }

        /* 셀링 포인트 배지 */
        .selling-points-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
            justify-content: center;
        }

        .selling-point-badge {
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 100px;
            font-size: 13px;
            font-weight: 600;
            color: white;
        }

        /* 예상 성과 박스 */
        .product-expected-result {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(16, 185, 129, 0.05));
            border: 2px solid var(--green);
            border-radius: 20px;
            padding: 24px;
        }

        .product-expected-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--green);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .product-expected-metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .product-expected-metric {
            text-align: center;
        }

        .product-expected-value {
            font-size: 24px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 4px;
        }

        .product-expected-label {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* 반응형 */
        @media (max-width: 1024px) {
            .product-single-layout {
                grid-template-columns: 1fr;
                gap: 40px;
            }
            .product-single-image {
                max-width: 400px;
                margin: 0 auto;
            }
        }

        @media (max-width: 768px) {
            .product-expected-metrics {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }

        /* 기존 코드 호환을 위한 유지 */
        .products-header {
            text-align: center;
            margin-bottom: 48px;
        }

        .products-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            align-items: start;
        }

        .product-showcase {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 32px;
            border: 1px solid var(--border);
        }

        .product-showcase-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .product-showcase-title i {
            color: var(--accent);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .product-card {
            background: var(--bg-dark);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: all 0.3s;
        }

        .product-card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
        }

        .product-card.featured {
            grid-column: span 2;
        }

        .product-image {
            width: 100%;
            aspect-ratio: 4/3;
            background: linear-gradient(135deg, #1e1e30, #2a2a40);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            position: relative;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 6px 12px;
            background: var(--accent);
            color: white;
            font-size: 11px;
            font-weight: 700;
            border-radius: 6px;
        }

        .product-info {
            padding: 16px;
        }

        .product-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }

        .product-price-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .product-original-price {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .product-deal-price {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent);
        }

        .product-discount {
            font-size: 12px;
            font-weight: 700;
            color: var(--green);
            margin-left: auto;
        }

        /* 공동구매 전략 */
        .strategy-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .strategy-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 28px;
            border: 1px solid var(--border);
            transition: all 0.3s;
        }

        .strategy-card:hover {
            border-color: var(--accent);
        }

        .strategy-num {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 16px;
        }

        .strategy-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .strategy-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.7;
        }

        .strategy-highlight {
            margin-top: 12px;
            padding: 12px 16px;
            background: rgba(249, 115, 22, 0.1);
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
        }

        /* 예상 성과 박스 */
        .expected-result {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(16, 185, 129, 0.05));
            border: 2px solid var(--green);
            border-radius: 20px;
            padding: 28px;
            margin-top: 24px;
        }

        .expected-result-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--green);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .result-metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .result-metric {
            text-align: center;
        }

        .result-metric-value {
            font-size: 28px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 4px;
        }

        .result-metric-label {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ===== 슬라이드 5: 협업 혜택 ===== */
        .slide-benefits {
            background: var(--bg-light);
        }

        .benefits-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .benefit-card {
            background: #fff;
            border-radius: 20px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
            border: 2px solid transparent;
            transition: all 0.4s;
        }

        .benefit-card:hover {
            border-color: var(--accent);
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(249, 115, 22, 0.15);
        }

        .benefit-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.1), rgba(249, 115, 22, 0.05));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 20px;
        }

        .benefit-card h3 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .benefit-card p {
            font-size: 13px;
            color: #64748b;
            line-height: 1.6;
        }

        /* ===== 슬라이드 6: 프로세스 (신규 - 공급사 vs 모여라딜) ===== */
        .slide-process {
            background: linear-gradient(135deg, #0a0a12 0%, #0f0f20 100%);
        }

        .process-comparison {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 32px;
            margin-bottom: 32px;
        }

        .process-role {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 28px;
            border: 2px solid var(--border);
        }

        .process-role.supplier {
            border-color: rgba(59, 130, 246, 0.3);
        }

        .process-role.moyeora {
            border-color: rgba(249, 115, 22, 0.3);
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.05), rgba(249, 115, 22, 0.02));
        }

        .role-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .role-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .supplier-icon {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(59, 130, 246, 0.1));

            font-weight: 700;

            padding: 6px 14px;

            font-weight: 700;
        }

        .role-badge.easy {

        }

        .role-badge.full {

        }

        .task-item {

            font-size: 14px;
            font-weight: 700;

        .task-content p {

            justify-content: center;

            background: rgba(59, 130, 246, 0.1);
            color: var(--blue);
        }

        .moyeora-summary {
            background: rgba(249, 115, 22, 0.15);
            color: var(--accent);
        }

        .role-summary i {
            font-size: 16px;
        }

        .process-guarantee {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 24px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(16, 185, 129, 0.05));
            border: 2px solid var(--green);
            border-radius: 20px;
        }

        .guarantee-icon {
            font-size: 40px;
        }

        .guarantee-text {
            font-size: 16px;
            line-height: 1.6;
            color: var(--text);
        }

        .guarantee-text strong {
            color: var(--green);
        }

        @media (max-width: 900px) {
            .process-comparison {
                grid-template-columns: 1fr;
            }
        }

        /* 기존 프로세스 타임라인 (백업) */
        .process-timeline {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin-bottom: 48px;
        }

        .process-timeline::before {
            content: '';
            position: absolute;
            top: 48px;
            left: 10%;
            right: 10%;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--purple));
            opacity: 0.4;
        }

        .process-step {
            flex: 1;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .process-num {
            width: 96px;
            height: 96px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 800;
            margin: 0 auto 20px;
            box-shadow: 0 8px 32px var(--accent-glow);
        }

        .process-step h4 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .process-step p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .process-time {
            margin-top: 12px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
        }

        /* ===== 슬라이드 7: CTA ===== */
        .slide-cta {
            background: linear-gradient(135deg, #0f0f20 0%, #1a1a35 100%);
            text-align: center;
        }

        .slide-cta .orb-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(249, 115, 22, 0.2), transparent 70%);
            top: 20%;
            left: 30%;
        }

        .cta-title {
            font-size: clamp(36px, 5vw, 56px);
            font-weight: 800;
            margin-bottom: 24px;
        }

        .cta-subtitle {
            font-size: 18px;
            color: var(--text-muted);
            margin-bottom: 48px;
        }

        .cta-box {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 40px 60px;
            display: inline-block;
            margin-bottom: 40px;
            border: 1px solid var(--border);
        }

        .cta-box h4 {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 16px;
        }

        .cta-box p {
            font-size: 16px;
        }

        .cta-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 18px 40px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: white;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            box-shadow: 0 8px 32px var(--accent-glow);
        }

        .cta-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 48px var(--accent-glow);
        }

        /* ===== 네비게이션 ===== */
        .nav-dots {
            position: fixed;
            right: 32px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
        }

        .nav-dot {
            width: 12px;
            height: 12px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
        }

        .nav-dot:hover,
        .nav-dot.active {
            background: var(--accent);
            transform: scale(1.3);
        }

        /* 페이지 추적 표시 */
        .tracking-indicator {
            position: fixed;
            bottom: 24px;
            left: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 12px;
            color: var(--text-muted);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tracking-indicator i { color: var(--green); }

        /* 반응형 */
        @media (max-width: 1024px) {
            .slide { padding: 40px 24px; }
            .problem-grid, .benefits-grid { grid-template-columns: 1fr; }
            .solution-grid, .products-layout { grid-template-columns: 1fr; }
            .process-timeline { flex-direction: column; gap: 32px; }
            .process-timeline::before { display: none; }
            .nav-dots { display: none; }
            .cover-meta { position: static; margin-top: 40px; text-align: left; }
            .result-metrics { grid-template-columns: 1fr; gap: 12px; }
        }

        @media (max-width: 768px) {
            .product-grid { grid-template-columns: 1fr; }
            .product-card.featured { grid-column: span 1; }
            .tracking-indicator { display: none; }
        }

        /* 로딩 */
        .loading-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            margin-top: 16px;
            font-size: 14px;
            color: var(--text-muted);
        }

        /* 애니메이션 */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }
        .delay-5 { animation-delay: 0.5s; }

        /* ===== 슬라이드: 핸드폰 목업 (공동구매 피드) ===== */
        .slide-mockup {

        // 제안서 로드
        async function loadProposal() {
            proposalId = getProposalId();

            if (!proposalId) {
                showError('제안서 ID가 없습니다');
                return;
            }

            try {
                const doc = await db.collection('proposalDerivatives').doc(proposalId).get();

                if (!doc.exists) {
                    showError('제안서를 찾을 수 없습니다');
                    return;
                }

                proposalData = { id: doc.id, ...doc.data() };
                document.title = `모여라딜 × ${proposalData.companyName || '공급사'} 맞춤 제안서`;

                // 조회수 증가 및 추적
                await trackView();

                // 슬라이드 렌더링
                renderSlides();

                // 네비게이션 설정
                setupNavigation();

                // 스크롤 추적 설정
                setupScrollTracking();

                // 로딩 숨기기
                hideLoading();

            } catch (e) {
                console.error('제안서 로드 오류:', e);
                showError('제안서를 불러올 수 없습니다');
            }
        }

        // 상품별 전략 생성 함수
        function generateProductStrategy(product, index, category, template) {
            const priceNum = parseInt(String(product.dealPrice || product.originalPrice || 30000).replace(/[^0-9]/g, ''));
            const discountRate = product.discount || 0;

            // 가격대별 전략
            let priceStrategy = '';
            let salesEstimate = '';
            let targetAudience = '';

            if (priceNum < 20000) {
                priceStrategy = '가성비 공구템';
                salesEstimate = '200~500개';
                targetAudience = '가성비 중시 고객';
            } else if (priceNum < 50000) {
                priceStrategy = '인기 공구가';
                salesEstimate = '100~300개';
                targetAudience = '품질 중시 고객';
            } else if (priceNum < 100000) {
                priceStrategy = '프리미엄 공구';
                salesEstimate = '50~150개';
                targetAudience = '프리미엄 고객층';
            } else {
                priceStrategy = 'VIP 공구딜';
                salesEstimate = '30~100개';
                targetAudience = '하이엔드 고객';
            }

            // 카테고리별 전략
            const categoryStrategies = {
                food: { icon: '🍽️', seller: '맘 셀러', content: '먹방/레시피 콘텐츠', hook: '유통기한 걱정 없이!' },

            };

            const catStrategy = categoryStrategies[category] || categoryStrategies.default;

            return {
                priceStrategy,
                salesEstimate,
                targetAudience,
                sellerType: catStrategy.seller,
                contentType: catStrategy.content,

                contentCount: discountRate > 20 ? '8~15개' : '5~10개',

        // 상품 렌더링
        function renderProducts(products) {

            return products.map((product, i) => {

                            ${isFeatured ? '<div class="product-badge">대표 상품</div>' : ''}
                            ${product.image ? `<img src="${product.image}" alt="${product.name}">` : product.icon || '📦'}
                        </div>
                        <div class="product-info">
                            <div class="product-name">${product.name}</div>
                            <div class="product-price-row">
                                ${product.originalPrice ? `<span class="product-original-price">${formatPrice(product.originalPrice)}원</span>` : ''}
                                <span class="product-deal-price">${product.dealPrice ? formatPrice(product.dealPrice) + '원' : '딜가 협의'}</span>
                                ${product.discount ? `<span class="product-discount">${product.discount}% OFF</span>` : ''}

        function formatPrice(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        // 네비게이션 설정
        function setupNavigation() {
            const navDots = document.getElementById('navDots');
            const slideCount = slides.length;

            navDots.innerHTML = '';
            for (let i = 0; i < slideCount; i++) {
                const dot = document.createElement('button');
                dot.className = 'nav-dot' + (i === 0 ? ' active' : '');
                dot.onclick = () => scrollToSlide(i);
                navDots.appendChild(dot);
            }
        }

        function scrollToSlide(index) {
            slides[index].scrollIntoView({ behavior: 'smooth' });
        }

        // 스크롤 추적
        function setupScrollTracking() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const slideNum = parseInt(entry.target.dataset.slide);

                    if (entry.isIntersecting) {
                        // 슬라이드 진입
                        pageStartTimes[slideNum] = Date.now();
                        currentSlideIndex = slideNum - 1;

                        // 네비게이션 업데이트
                        document.querySelectorAll('.nav-dot').forEach((dot, i) => {
                            dot.classList.toggle('active', i === currentSlideIndex);
                        });

                        // 페이지 조회 추적
                        trackPageView(slideNum);

                        // 애니메이션 재생
                        entry.target.querySelectorAll('.fade-in').forEach(el => {
                            el.style.animationPlayState = 'running';
                        });
                    } else {
                        // 슬라이드 이탈 - 체류시간 기록
                        if (pageStartTimes[slideNum]) {
                            const duration = Date.now() - pageStartTimes[slideNum];
                            trackPageDuration(slideNum, duration);
                            delete pageStartTimes[slideNum];
                        }
                    }
                });
            }, { threshold: 0.5 });

            slides.forEach(slide => {
                slide.querySelectorAll('.fade-in').forEach(el => {
                    el.style.animationPlayState = 'paused';
                });
                observer.observe(slide);
            });
        }

        // 조회 추적
        async function trackView() {
            try {
                // 조회수 증가
                await db.collection('proposalDerivatives').doc(proposalId).update({
                    viewCount: firebase.firestore.FieldValue.increment(1),
                    lastViewedAt: new Date().toISOString()
                });

                // 세션 기록
                await db.collection('proposalAnalytics').add({
                    proposalId,
                    sessionId,
                    event: 'view',
                    companyName: proposalData.companyName || '',
                    category: proposalData.category || '',
                    timestamp: new Date().toISOString(),
                    userAgent: navigator.userAgent,
                    referrer: document.referrer || 'direct'
                });

                // 현재 조회수 표시
                const currentCount = (proposalData.viewCount || 0) + 1;
                document.getElementById('viewCount').textContent = currentCount;

            } catch (e) {
                console.error('추적 오류:', e);
            }
        }

        // 페이지 조회 추적
        async function trackPageView(pageNum) {
            try {
                await db.collection('proposalAnalytics').add({
                    proposalId,
                    sessionId,
                    event: 'page_view',
                    page: pageNum,
                    pageName: getPageName(pageNum),
                    timestamp: new Date().toISOString()
                });
            } catch (e) {
                console.error('페이지 추적 오류:', e);
            }
        }

        // 페이지 체류시간 추적
        async function trackPageDuration(pageNum, duration) {
            try {
                await db.collection('proposalAnalytics').add({
                    proposalId,
                    sessionId,
                    event: 'page_duration',
                    page: pageNum,
                    pageName: getPageName(pageNum),
                    duration: duration,
                    durationSeconds: Math.round(duration / 1000),
                    timestamp: new Date().toISOString()
                });
            } catch (e) {
                console.error('체류시간 추적 오류:', e);
            }
        }

        function getPageName(pageNum) {
            // 동적 슬라이드 번호 처리
            const products = proposalData?.products || [];
            const productCount = products.length > 0 ? products.length : 1;
            const productSlideStart = 6;  // 비용 슬라이드 2개 추가로 6부터 시작
            const productSlideEnd = productSlideStart + productCount - 1;

            // 기본 슬라이드 (1~3)
            if (pageNum === 1) return '커버';
            if (pageNum === 2) return '문제점';
            if (pageNum === 3) return '솔루션';

            // 비용 비교 슬라이드 (4~5)
            if (pageNum === 4) return '비용비교';
            if (pageNum === 5) return '비용시뮬레이터';

            // 상품 슬라이드들 (6 ~ 6+productCount-1)
            if (pageNum >= productSlideStart && pageNum <= productSlideEnd) {
                const productIndex = pageNum - productSlideStart;
                const productName = products[productIndex]?.name || `상품 ${productIndex + 1}`;
                return `상품: ${productName.substring(0, 10)}`;
            }

            // 상품 슬라이드 이후
            const afterProductSlide = pageNum - productSlideEnd;
            const afterNames = ['SNS콘텐츠', '콘텐츠갤러리', '파트너포털', '혜택', '프로세스', 'CTA'];
            return afterNames[afterProductSlide - 1] || `페이지 ${pageNum}`;
        }

        // 시뮬레이터 함수들
        function updateSimulator(value) {
            const qty = parseInt(value);
            const oldProfit = 1200;  // 기존 플랫폼 1개당 순마진
            const newProfit = 5000;  // 모여라딜 1개당 순마진

            const oldTotal = qty * oldProfit;
            const newTotal = qty * newProfit;
            const savings = newTotal - oldTotal;
            const yearlySavings = savings * 12;

            // 슬라이더 퍼센트 업데이트
            const percent = ((qty - 50) / (1000 - 50)) * 100;
            document.getElementById('simSlider').style.setProperty('--slider-percent', percent + '%');

            // 값 업데이트
            document.getElementById('simQuantity').textContent = qty + '개';
            document.getElementById('simQtyLabel').textContent = qty + '개';
            document.getElementById('simOldProfit').textContent = formatPrice(oldTotal) + '원';
            document.getElementById('simNewProfit').textContent = formatPrice(newTotal) + '원';
            document.getElementById('simSavings').textContent = formatPrice(savings) + '원';
            document.getElementById('simTotalSavings').textContent = '+' + formatPrice(savings) + '원';
            document.getElementById('simYearlySavings').textContent = formatPrice(yearlySavings) + '원';

            // 프리셋 버튼 활성화 상태
            document.querySelectorAll('.sim-preset').forEach(btn => {
                const btnVal = parseInt(btn.textContent);
                btn.classList.toggle('active', btnVal === qty);
            });
        }

        function setSimValue(value) {
            document.getElementById('simSlider').value = value;
            updateSimulator(value);
        }

        // 입점 신청
        function openApply() {
            // 간단한 알림 또는 모달로 연결
            alert(`입점 상담 신청\n\n${proposalData.companyName || '귀사'}의 입점 상담을 진행합니다.\n\n📞 070-8664-0609\n📧 moyeoradeal@naver.com\n\n담당자가 빠르게 연락드리겠습니다!`);

            // CTA 클릭 추적
            try {
                db.collection('proposalAnalytics').add({
                    proposalId,
                    sessionId,
                    event: 'cta_click',
                    action: 'apply',
                    timestamp: new Date().toISOString()
                });
            } catch (e) { }
        }

        // 페이지 이탈 시 체류시간 기록
        window.addEventListener('beforeunload', () => {
            Object.keys(pageStartTimes).forEach(pageNum => {
                const duration = Date.now() - pageStartTimes[pageNum];
                // 동기 방식으로 전송 (navigator.sendBeacon)
                const data = JSON.stringify({
                    proposalId,
                    sessionId,
                    event: 'page_duration',
                    page: parseInt(pageNum),
                    duration,
                    timestamp: new Date().toISOString()
                });
                navigator.sendBeacon && navigator.sendBeacon('https://us-central1-moyeora-deal-manager.cloudfunctions.net/trackAnalytics', data);
            });
        });

        function showError(msg) {
            document.getElementById('loadingScreen').innerHTML = `
                <div style="text-align: center;">
                    <div style="font-size: 64px; margin-bottom: 20px;">😢</div>
                    <p style="font-size: 18px; color: var(--text-muted);">${msg}</p>
                </div>
            `;
        }

        function hideLoading() {
            document.getElementById('loadingScreen').style.display = 'none';
        }

        // 초기화
        document.addEventListener('DOMContentLoaded', loadProposal);
    </script>
</body>
</html>
