<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제안서 분석 - 모여라딜</title>
    <link rel="icon" type="image/png" href="../../admin/favicon.png">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f5f5f5;
            --bg-card: #ffffff;
            --accent: #f97316;
            --accent-light: #fb923c;
            --green: #10b981;
            --blue: #3b82f6;
            --purple: #8b5cf6;
            --red: #ef4444;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            padding: 20px 32px;
            color: white;
        }

        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn {
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px;
        }

        /* 상단 정보 */
        .proposal-info {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 32px;
            margin-bottom: 32px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .proposal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .proposal-title {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .proposal-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }

        .proposal-name {
            font-size: 24px;
            font-weight: 700;
        }

        .proposal-category {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .proposal-actions {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            text-decoration: none;
        }

        .action-btn.primary {
            background: var(--accent);
            color: white;
            border: none;
        }

        .action-btn.primary:hover {
            background: var(--accent-light);
            transform: translateY(-2px);
        }

        .action-btn.secondary {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .action-btn.secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .proposal-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            background: var(--bg);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .proposal-link input {
            flex: 1;
            border: none;
            background: none;
            font-size: 14px;
            color: var(--text);
            outline: none;
        }

        .copy-btn {
            padding: 8px 16px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .copy-btn:hover {
            background: var(--accent-light);
        }

        /* 통계 그리드 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .stat-card.highlight {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: white;
        }

        .stat-icon {
            width: 44px;
            height: 44px;
            background: var(--bg);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 16px;
        }

        .stat-card.highlight .stat-icon {
            background: rgba(255,255,255,0.2);
        }

        .stat-value {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-muted);
        }

        .stat-card.highlight .stat-label {
            color: rgba(255,255,255,0.8);
        }

        .stat-change {
            font-size: 12px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stat-change.up { color: var(--green); }
        .stat-change.down { color: var(--red); }

        /* 차트 영역 */
        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
            margin-bottom: 32px;
        }

        .chart-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .chart-title {
            font-size: 18px;
            font-weight: 700;
        }

        .chart-filter {
            display: flex;
            gap: 8px;
        }

        .filter-btn {
            padding: 6px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .filter-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        /* 페이지별 체류시간 */
        .page-stats-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .page-stat-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: var(--bg);
            border-radius: 12px;
        }

        .page-num {
            width: 32px;
            height: 32px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: white;
        }

        .page-info {
            flex: 1;
        }

        .page-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .page-bar {
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .page-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            border-radius: 4px;
        }

        .page-duration {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            min-width: 60px;
            text-align: right;
        }

        .page-views {
            font-size: 12px;
            color: var(--text-muted);
            min-width: 80px;
            text-align: right;
        }

        /* 세션 리스트 */
        .sessions-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .session-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
        }

        .session-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: var(--bg);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .session-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .session-info {
            flex: 1;
        }

        .session-time {
            font-size: 14px;
            font-weight: 600;
        }

        .session-detail {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .session-pages {
            display: flex;
            gap: 4px;
        }

        .session-page-dot {
            width: 8px;
            height: 8px;
            background: var(--border);
            border-radius: 50%;
        }

        .session-page-dot.viewed {
            background: var(--green);
        }

        .session-duration {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
        }

        /* 반응형 */
        @media (max-width: 1200px) {
            .stats-grid { grid-template-columns: repeat(3, 1fr); }
            .charts-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) {
            .container { padding: 16px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .proposal-header { flex-direction: column; gap: 20px; align-items: flex-start; }
            .proposal-actions { width: 100%; }
            .action-btn { flex: 1; justify-content: center; }
        }

        /* 로딩 */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            color: var(--text-muted);
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 12px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* 토스트 */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 14px 28px;
            background: var(--text);
            color: white;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-inner">
            <a href="../proposal-manager.html" class="logo">
                <span>☀️ 모여라딜</span>
            </a>
            <a href="../proposal-manager.html" class="back-btn">
                <i class="fas fa-arrow-left"></i>
                제안서 관리로 돌아가기
            </a>
        </div>
    </div>

    <div class="container">
        <!-- 제안서 정보 -->
        <div class="proposal-info" id="proposalInfo">
            <div class="loading">
                <div class="spinner"></div>
                로딩 중...
            </div>
        </div>

        <!-- 통계 -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card highlight">
                <div class="stat-icon">👁️</div>
                <div class="stat-value" id="totalViews">-</div>
                <div class="stat-label">총 조회수</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">👤</div>
                <div class="stat-value" id="uniqueVisitors">-</div>
                <div class="stat-label">순 방문자</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⏱️</div>
                <div class="stat-value" id="avgDuration">-</div>
                <div class="stat-label">평균 체류시간</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📄</div>
                <div class="stat-value" id="avgPages">-</div>
                <div class="stat-label">평균 열람 페이지</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🎯</div>
                <div class="stat-value" id="ctaClicks">-</div>
                <div class="stat-label">CTA 클릭</div>
            </div>
        </div>

        <!-- 차트 영역 -->
        <div class="charts-grid">
            <!-- 페이지별 체류시간 -->
            <div class="chart-card">
                <div class="chart-header">
                    <h3 class="chart-title">📊 페이지별 관심도</h3>
                </div>
                <div class="page-stats-list" id="pageStatsList">
                    <div class="loading">
                        <div class="spinner"></div>
                        분석 중...
                    </div>
                </div>
            </div>

            <!-- 핫 페이지 -->
            <div class="chart-card">
                <div class="chart-header">
                    <h3 class="chart-title">🔥 가장 많이 본 페이지</h3>
                </div>
                <div id="hotPages">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 세션 리스트 -->
        <div class="sessions-card">
            <div class="chart-header">
                <h3 class="chart-title">👀 최근 열람 기록</h3>
                <div class="chart-filter">
                    <button class="filter-btn active" onclick="filterSessions('all')">전체</button>
                    <button class="filter-btn" onclick="filterSessions('today')">오늘</button>
                    <button class="filter-btn" onclick="filterSessions('week')">이번 주</button>
                </div>
            </div>
            <div class="session-list" id="sessionList">
                <div class="loading">
                    <div class="spinner"></div>
                    로딩 중...
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // Firebase 설정
        const firebaseConfig = {
            apiKey: "AIzaSyAQf_Cu9wMji5QsMBQns5eg6nOD_vmrZMs",
            authDomain: "moyeora-deal-manager.firebaseapp.com",
            projectId: "moyeora-deal-manager",
            storageBucket: "moyeora-deal-manager.firebasestorage.app",
            messagingSenderId: "527148187832",
            appId: "1:527148187832:web:dc35b0413a7157db34744d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const BASE_URL = 'https://netformrnd-lab.github.io';
        let proposalId = null;
        let proposalData = null;
        let analyticsData = [];

        // URL에서 ID 가져오기
        function getProposalId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        // 초기화
        async function init() {
            proposalId = getProposalId();

            if (!proposalId) {
                showError('제안서 ID가 없습니다');
                return;
            }

            await loadProposalData();
            await loadAnalytics();
        }

        // 제안서 데이터 로드
        async function loadProposalData() {
            try {
                const doc = await db.collection('proposalDerivatives').doc(proposalId).get();

                if (!doc.exists) {
                    showError('제안서를 찾을 수 없습니다');
                    return;
                }

                proposalData = { id: doc.id, ...doc.data() };
                renderProposalInfo();

            } catch (e) {
                console.error('제안서 로드 오류:', e);
            }
        }

        // 제안서 정보 렌더링
        function renderProposalInfo() {
            const categoryIcons = {
                food: '🍽️',
                baby: '👶',
                lifestyle: '🧹',
                default: '📦'
            };

            const categoryNames = {
                food: '식품/음료',
                baby: '육아/키즈',
                lifestyle: '생활용품',
                default: '일반'
            };

            const icon = categoryIcons[proposalData.category] || categoryIcons.default;
            const categoryName = categoryNames[proposalData.category] || categoryNames.default;
            const viewUrl = `${BASE_URL}/supplier/custom-proposal/view.html?id=${proposalId}`;

            document.getElementById('proposalInfo').innerHTML = `
                <div class="proposal-header">
                    <div class="proposal-title">
                        <div class="proposal-icon">${icon}</div>
                        <div>
                            <h2 class="proposal-name">${proposalData.companyName || '공급사'} 맞춤 제안서</h2>
                            <p class="proposal-category">${categoryName} · 생성: ${formatDate(proposalData.createdAt)}</p>
                        </div>
                    </div>
                    <div class="proposal-actions">
                        <a href="${viewUrl}" target="_blank" class="action-btn secondary">
                            <i class="fas fa-external-link-alt"></i>
                            제안서 보기
                        </a>
                        <button class="action-btn primary" onclick="shareProposal()">
                            <i class="fas fa-share"></i>
                            공유하기
                        </button>
                    </div>
                </div>
                <div class="proposal-link">
                    <i class="fas fa-link" style="color: var(--text-muted);"></i>
                    <input type="text" id="proposalUrl" value="${viewUrl}" readonly>
                    <button class="copy-btn" onclick="copyUrl()">
                        <i class="fas fa-copy"></i> 복사
                    </button>
                </div>
            `;
        }

        // 분석 데이터 로드
        async function loadAnalytics() {
            try {
                // composite index 없이도 동작하도록 orderBy 제거 후 클라이언트에서 정렬
                const snapshot = await db.collection('proposalAnalytics')
                    .where('proposalId', '==', proposalId)
                    .limit(500)
                    .get();

                analyticsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                // 최신순 정렬 (클라이언트)
                analyticsData.sort((a, b) => {
                    const tA = a.timestamp ? new Date(a.timestamp).getTime() : 0;
                    const tB = b.timestamp ? new Date(b.timestamp).getTime() : 0;
                    return tB - tA;
                });

                renderStats();
                renderPageStats();
                renderSessions();

            } catch (e) {
                console.error('분석 데이터 로드 오류:', e);
                // 에러 시 빈 데이터로라도 UI 렌더링
                analyticsData = [];
                renderStats();
                renderPageStats();
                renderSessions();
            }
        }

        // 통계 렌더링
        function renderStats() {
            // 총 조회수
            const viewCount = proposalData.viewCount || analyticsData.filter(a => a.event === 'view').length;
            document.getElementById('totalViews').textContent = viewCount;

            // 순 방문자 (세션 기준)
            const uniqueSessions = new Set(analyticsData.map(a => a.sessionId)).size;
            document.getElementById('uniqueVisitors').textContent = uniqueSessions;

            // 평균 체류시간
            const durations = analyticsData.filter(a => a.event === 'page_duration');
            const sessionDurations = {};
            durations.forEach(d => {
                if (!sessionDurations[d.sessionId]) sessionDurations[d.sessionId] = 0;
                sessionDurations[d.sessionId] += d.duration || 0;
            });
            const avgDuration = Object.values(sessionDurations).length > 0
                ? Object.values(sessionDurations).reduce((a, b) => a + b, 0) / Object.values(sessionDurations).length
                : 0;
            document.getElementById('avgDuration').textContent = formatDuration(avgDuration);

            // 평균 열람 페이지
            const pageViews = analyticsData.filter(a => a.event === 'page_view');
            const sessionPages = {};
            pageViews.forEach(p => {
                if (!sessionPages[p.sessionId]) sessionPages[p.sessionId] = new Set();
                sessionPages[p.sessionId].add(p.page);
            });
            const avgPages = Object.values(sessionPages).length > 0
                ? Object.values(sessionPages).reduce((a, b) => a + b.size, 0) / Object.values(sessionPages).length
                : 0;
            document.getElementById('avgPages').textContent = avgPages.toFixed(1);

            // CTA 클릭
            const ctaClicks = analyticsData.filter(a => a.event === 'cta_click').length;
            document.getElementById('ctaClicks').textContent = ctaClicks;
        }

        // 페이지별 통계 렌더링
        function renderPageStats() {
            const pageNames = ['', '커버', '문제점', '솔루션', '상품전략', '혜택', '프로세스', 'CTA'];
            const pageViews = {};
            const pageDurations = {};

            analyticsData.forEach(a => {
                if (a.event === 'page_view' && a.page) {
                    pageViews[a.page] = (pageViews[a.page] || 0) + 1;
                }
                if (a.event === 'page_duration' && a.page) {
                    if (!pageDurations[a.page]) pageDurations[a.page] = [];
                    pageDurations[a.page].push(a.duration || 0);
                }
            });

            const maxViews = Math.max(...Object.values(pageViews), 1);

            let html = '';
            for (let i = 1; i <= 7; i++) {
                const views = pageViews[i] || 0;
                const durations = pageDurations[i] || [];
                const avgDuration = durations.length > 0
                    ? durations.reduce((a, b) => a + b, 0) / durations.length
                    : 0;
                const percentage = (views / maxViews) * 100;

                html += `
                    <div class="page-stat-item">
                        <div class="page-num">${i}</div>
                        <div class="page-info">
                            <div class="page-name">${pageNames[i]}</div>
                            <div class="page-bar">
                                <div class="page-bar-fill" style="width: ${percentage}%"></div>
                            </div>
                        </div>
                        <div class="page-views">${views}회 조회</div>
                        <div class="page-duration">${formatDuration(avgDuration)}</div>
                    </div>
                `;
            }

            document.getElementById('pageStatsList').innerHTML = html || '<p style="color: var(--text-muted); padding: 20px;">아직 데이터가 없습니다</p>';

            // 핫 페이지
            const sortedPages = Object.entries(pageViews)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 3);

            let hotHtml = '';
            sortedPages.forEach(([page, views], i) => {
                const medals = ['🥇', '🥈', '🥉'];
                hotHtml += `
                    <div class="page-stat-item" style="margin-bottom: 12px;">
                        <span style="font-size: 24px;">${medals[i]}</span>
                        <div class="page-info">
                            <div class="page-name">${pageNames[page]} 페이지</div>
                        </div>
                        <div class="page-views" style="font-size: 16px; font-weight: 700; color: var(--accent);">${views}회</div>
                    </div>
                `;
            });

            document.getElementById('hotPages').innerHTML = hotHtml || '<p style="color: var(--text-muted); padding: 20px;">아직 데이터가 없습니다</p>';
        }

        // 세션 렌더링
        function renderSessions(filter = 'all') {
            const sessions = {};

            analyticsData.forEach(a => {
                if (!sessions[a.sessionId]) {
                    sessions[a.sessionId] = {
                        timestamp: a.timestamp,
                        pages: new Set(),
                        duration: 0,
                        userAgent: a.userAgent || ''
                    };
                }
                if (a.event === 'page_view' && a.page) {
                    sessions[a.sessionId].pages.add(a.page);
                }
                if (a.event === 'page_duration') {
                    sessions[a.sessionId].duration += a.duration || 0;
                }
            });

            let sessionList = Object.entries(sessions)
                .sort((a, b) => new Date(b[1].timestamp) - new Date(a[1].timestamp));

            // 필터 적용
            const now = new Date();
            if (filter === 'today') {
                sessionList = sessionList.filter(([_, s]) => {
                    const date = new Date(s.timestamp);
                    return date.toDateString() === now.toDateString();
                });
            } else if (filter === 'week') {
                const weekAgo = new Date(now - 7 * 24 * 60 * 60 * 1000);
                sessionList = sessionList.filter(([_, s]) => new Date(s.timestamp) > weekAgo);
            }

            let html = '';
            sessionList.slice(0, 20).forEach(([sessionId, session]) => {
                const isMobile = /mobile|android|iphone/i.test(session.userAgent);
                const device = isMobile ? 'fas fa-mobile-alt' : 'fas fa-desktop';

                let pageDots = '';
                for (let i = 1; i <= 7; i++) {
                    pageDots += `<div class="session-page-dot ${session.pages.has(i) ? 'viewed' : ''}"></div>`;
                }

                html += `
                    <div class="session-item">
                        <div class="session-icon">
                            <i class="${device}"></i>
                        </div>
                        <div class="session-info">
                            <div class="session-time">${formatDateTime(session.timestamp)}</div>
                            <div class="session-detail">${session.pages.size}페이지 열람</div>
                        </div>
                        <div class="session-pages">${pageDots}</div>
                        <div class="session-duration">${formatDuration(session.duration)}</div>
                    </div>
                `;
            });

            document.getElementById('sessionList').innerHTML = html || '<p style="color: var(--text-muted); padding: 20px; text-align: center;">아직 열람 기록이 없습니다</p>';
        }

        // 필터
        function filterSessions(filter) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderSessions(filter);
        }

        // 유틸리티
        function formatDate(timestamp) {
            if (!timestamp) return '-';
            const date = new Date(timestamp);
            return `${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, '0')}.${String(date.getDate()).padStart(2, '0')}`;
        }

        function formatDateTime(timestamp) {
            if (!timestamp) return '-';
            const date = new Date(timestamp);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);

            if (diffMins < 1) return '방금 전';
            if (diffMins < 60) return `${diffMins}분 전`;
            if (diffHours < 24) return `${diffHours}시간 전`;
            if (diffDays < 7) return `${diffDays}일 전`;

            return `${date.getMonth() + 1}/${date.getDate()} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
        }

        function formatDuration(ms) {
            if (!ms || ms < 1000) return '0초';
            const seconds = Math.floor(ms / 1000);
            if (seconds < 60) return `${seconds}초`;
            const minutes = Math.floor(seconds / 60);
            const remainSecs = seconds % 60;
            if (minutes < 60) return `${minutes}분 ${remainSecs}초`;
            const hours = Math.floor(minutes / 60);
            const remainMins = minutes % 60;
            return `${hours}시간 ${remainMins}분`;
        }

        function copyUrl() {
            const input = document.getElementById('proposalUrl');
            input.select();
            document.execCommand('copy');
            showToast('링크가 복사되었습니다');
        }

        function shareProposal() {
            const url = document.getElementById('proposalUrl').value;
            if (navigator.share) {
                navigator.share({
                    title: `${proposalData.companyName} 맞춤 제안서`,
                    url: url
                });
            } else {
                copyUrl();
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function showError(msg) {
            document.getElementById('proposalInfo').innerHTML = `
                <div style="text-align: center; padding: 40px;">
                    <p style="font-size: 48px; margin-bottom: 16px;">😢</p>
                    <p style="color: var(--text-muted);">${msg}</p>
                </div>
            `;
        }

        // 초기화
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
